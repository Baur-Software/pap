<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Papillion &amp; PAP</title>
  <meta name="description" content="AI that follows your rules. Built on the Principal Agent Protocol." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #060609;
      --surface: #0c0d14;
      --border: #1c1e2e;
      --violet: #8b5cf6;
      --indigo: #6366f1;
      --text: #e8ecf4;
      --muted: #8892a8;
      --faint: #4a5068;
    }
    html { font-size: 16px; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper { text-align: center; padding: 48px 24px; max-width: 640px; }
    h1 {
      font-size: 2.4rem; font-weight: 800; letter-spacing: -.02em;
      margin-bottom: 12px;
    }
    h1 span {
      background: linear-gradient(135deg, var(--violet), var(--indigo));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p { color: var(--muted); font-size: 1.1rem; line-height: 1.6; margin-bottom: 48px; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .card {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 40px 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      text-decoration: none; color: var(--text);
      transition: border-color .2s, transform .15s;
    }
    .card:hover { border-color: var(--violet); transform: translateY(-3px); }
    .card-icon { font-size: 2.2rem; margin-bottom: 16px; }
    .card h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 6px; }
    .card p { color: var(--muted); font-size: .9rem; margin-bottom: 0; }
    @media (max-width: 500px) { .cards { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1><span>Papillion</span> &amp; PAP</h1>
    <p>AI that follows your rules &mdash; built on the Principal Agent Protocol.</p>
    <div class="cards">
      <a href="papillion/" class="card">
        <div class="card-icon">&#x1F98B;</div>
        <h2>Papillion</h2>
        <p>The experience of controlled AI. See how it works.</p>
      </a>
      <a href="pap/" class="card">
        <div class="card-icon">&#x1F4DC;</div>
        <h2>PAP Protocol</h2>
        <p>Technical specification for developers and integrators.</p>
      </a>
    </div>
  </div>
</body>
</html>
