services:
  registry:
    build:
      context: ../..
      dockerfile: apps/registry/Dockerfile
      tags:
        - pap-registry:latest
    ports:
      - "7890:7890"
    volumes:
      - registry_data:/data
    environment:
      # Public URL peers will use to connect to this node.
      # Change to your server's hostname/IP before deploying.
      PAP_REGISTRY_ENDPOINT: "https://localhost:7890"
      PAP_REGISTRY_PORT: "7890"
      PAP_REGISTRY_HOST: "0.0.0.0"
      # SQLite DB path inside the container (persisted via the registry_data volume).
      # To use Postgres instead, mount a db.yml file with driver: postgres + url.
      PAP_REGISTRY_DB: "/data/registry.db"
      # Leptos site root for CSS/WASM assets
      LEPTOS_SITE_ROOT: "/app/site"
      # Uncomment to protect admin API routes with a Bearer token:
      # PAP_REGISTRY_ADMIN_TOKEN: "change-me-before-deploying"
      # Uncomment ONCE to recover from "migration was previously applied but
      # has been modified" errors (deletes all data and regenerates identity):
      # PAP_REGISTRY_RESET_DB: "true"

      # Authentication
      PAP_REGISTRY_ADMIN_TOKEN: ${PAP_REGISTRY_ADMIN_TOKEN:-change-me}
      PAP_REGISTRY_REQUIRE_AUTH: ${PAP_REGISTRY_REQUIRE_AUTH:-false}

      # OIDC (optional)
      PAP_REGISTRY_OIDC_ISSUER: ${PAP_REGISTRY_OIDC_ISSUER:-}
      PAP_REGISTRY_OIDC_AUDIENCE: ${PAP_REGISTRY_OIDC_AUDIENCE:-}

      # AWS (optional)
      PAP_REGISTRY_AWS_REGION: ${PAP_REGISTRY_AWS_REGION:-us-east-1}
      PAP_REGISTRY_ENABLE_API_KEYS: ${PAP_REGISTRY_ENABLE_API_KEYS:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:7890/federation/identity"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Run the test suite in an isolated container:
  #   docker compose --profile test run --rm test
  test:
    build:
      context: ../..
      dockerfile: apps/registry/Dockerfile
      target: test
    profiles:
      - test

volumes:
  registry_data:
