[package]
name = "papillon"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["semantic-index"]
semantic-index = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
papillon-shared = { workspace = true, features = ["native"] }
pap-did = { workspace = true }
pap-core = { workspace = true }
pap-credential = { workspace = true }
pap-marketplace = { workspace = true }
pap-webauthn = { workspace = true }
pap-proto = { workspace = true }
pap-transport = { workspace = true }
pap-agents = { workspace = true, features = ["semantic"] }
pap-credential-store = { path = "../../crates/pap-credential-store" }
pap-federation = { workspace = true, features = ["native"] }
pap-sandbox = { workspace = true, features = ["tauri"] }

tauri = { version = "2", features = [] }
tauri-plugin-store = "2"

candle-core = { workspace = true }
candle-nn = { version = "0.10" }
candle-transformers = { workspace = true }
tokenizers = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "stream"] }
futures-util = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }

ed25519-dalek = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
tracing = "0.1"
if-addrs = "0.7"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
