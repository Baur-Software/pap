[workspace]

[package]
name = "papillion-ui"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
papillion-shared = { path = "../../../crates/papillion-shared", default-features = false, features = ["wasm"] }
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "CustomEvent", "EventTarget", "HtmlInputElement", "KeyboardEvent", "Navigator", "Clipboard", "File", "HtmlAnchorElement", "FileList", "Blob", "Url"] }
console_error_panic_hook = "0.1"
uuid = { version = "1", features = ["v4", "js"] }
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
