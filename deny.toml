[advisories]
# vulnerability: denied by default in cargo-deny v2
# unmaintained/unsound use scope values in v2: "all"|"workspace"|"transitive"|"none"
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
ignore = [
    # glib 0.18.5 unsoundness via tauri/GTK transitive dep; upstream fix exists in newer glib
    { id = "RUSTSEC-2024-0429", reason = "transitive dep via tauri/GTK; upgrade tracked separately" },
    # rustls-pemfile archived Aug 2025; migration to rustls-pki-types tracked separately
    { id = "RUSTSEC-2025-0134", reason = "workspace dep; migration to rustls-pki-types tracked separately" },
]

[bans]
multiple-versions = "warn"

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
