[advisories]
# vulnerability: denied by default in cargo-deny v2
# unmaintained/unsound use scope values in v2: "all"|"workspace"|"transitive"|"none"
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
ignore = [
    # glib 0.18.5 unsoundness via tauri/GTK transitive dep; upstream fix exists in newer glib
    { id = "RUSTSEC-2024-0429", reason = "transitive dep via tauri/GTK; upgrade tracked separately" },
    # rustls-pemfile archived Aug 2025; migration to rustls-pki-types tracked separately
    { id = "RUSTSEC-2025-0134", reason = "workspace dep; migration to rustls-pki-types tracked separately" },
    # rsa v0.7.2 Marvin Attack timing side-channel pulled in by blind-rsa-signatures 0.14.
    # No patched release of rsa is available on crates.io. The pap-ecash issuer is a
    # trusted offline node; key-recovery via network timing is not in the threat model.
    # Track upstream: https://github.com/RustCrypto/RSA/issues/19
    { id = "RUSTSEC-2023-0071", reason = "transitive via blind-rsa-signatures 0.14; no patched rsa release available; ecash issuer is offline/trusted, Marvin attack not in threat model" },
    # rand crate is unsound when a custom global logger that calls rand::rng() is used.
    # No patched release available; the PAP codebase does not use custom loggers with rand.
    # Track upstream: https://rustsec.org/advisories/RUSTSEC-2026-0097
    { id = "RUSTSEC-2026-0097", reason = "transitive dep; PAP does not use custom loggers that invoke rand::rng(); tracked for upgrade separately" },
    # atty v0.2.14 unsound (unaligned read on Windows); transitive build-time dep via
    # rdma-sys 0.3.0 -> bindgen 0.59.2 -> clap/env_logger -> atty. Not shipped in any
    # binary. No patched atty release exists; fix requires rdma-sys to bump bindgen >= 0.66.
    { id = "RUSTSEC-2021-0145", reason = "transitive build dep via rdma-sys/bindgen 0.59.2; atty unmaintained with no patched release; build-time only, not shipped in any binary" },
]

[bans]
multiple-versions = "warn"

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
