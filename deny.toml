[advisories]
# vulnerability and unlicensed are denied by default in cargo-deny v2
# unmaintained: "workspace" = check workspace crates only
# unsound: "all" = check workspace + transitive deps
unmaintained = "workspace"
unsound = "all"
yanked = "deny"

[bans]
multiple-versions = "warn"

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
