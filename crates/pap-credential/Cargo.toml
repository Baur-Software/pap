[package]
name = "pap-credential"
description = "W3C Verifiable Credential envelope and SD-JWT for the Principal Agent Protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
wasm = ["pap-did/wasm", "uuid/js", "getrandom/js"]

[dependencies]
pap-did = { workspace = true }
pap-core = { workspace = true }
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
getrandom = { workspace = true, optional = true }

[dev-dependencies]
pap-test-utils = { workspace = true }

[lints]
workspace = true
