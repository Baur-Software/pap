[package]
name = "pap-agents"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared PAP agent implementations — reusable across Papillon, Chrysalis, and any PAP node"

[dependencies]
pap-did = { workspace = true }
pap-core = { workspace = true }
pap-credential-store = { workspace = true }
pap-transport = { workspace = true }
pap-marketplace = { workspace = true }
pap-federation = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json"] }
url = "2"
uuid = { workspace = true }
chrono = { workspace = true }
ed25519-dalek = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
pap-credential-store = { workspace = true, features = ["testing"] }
rand = { workspace = true }
tempfile = "3"
