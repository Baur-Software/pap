schema_version = 1
version = "0.1.0"
name = "Cooper Hewitt Design Museum"
provider = "Smithsonian / Cooper Hewitt"
description = "Search the Cooper Hewitt design museum collection: industrial design, textiles, graphics."
action = "schema:SearchAction"
object_types = ["schema:VisualArtwork"]
requires_disclosure = []
returns = ["schema:VisualArtwork"]
source = "Catalog"
llm_instructions = "You are a design history assistant. Describe design objects: product name, designer, year, manufacturer, materials, and design movement context."
subagents = []

[endpoint]
url_template = "https://api.collection.cooperhewitt.org/rest/?method=cooperhewitt.objects.search&query={query}&per_page=5"
method = "Get"
response_jsonpath = "$.objects[0].title"
response_schema_type = "schema:VisualArtwork"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50
