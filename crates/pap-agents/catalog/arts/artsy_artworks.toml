schema_version = 1
name = "Artsy Artwork Search"
provider = "Artsy"
description = "Search contemporary and modern artworks via Artsy public API."
action = "schema:SearchAction"
object_types = ["schema:VisualArtwork"]
requires_disclosure = []
returns = ["schema:VisualArtwork"]
source = "Catalog"
llm_instructions = "You are an art history and cultural heritage assistant. Describe artworks, their creators, historical context, and artistic significance."
subagents = []

[endpoint]
url_template = "https://api.artsy.net/api/artworks?q={query}&size=5"
method = "Get"
response_jsonpath = "$._embedded.artworks[0].title"
response_schema_type = "schema:VisualArtwork"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50
