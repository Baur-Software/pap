schema_version = 1
version = "0.1.0"
name = "Smithsonian Open Access"
provider = "Smithsonian Institution"
description = "Search the Smithsonian's 4.7 million open access digital records."
action = "schema:SearchAction"
object_types = ["schema:CreativeWork"]
requires_disclosure = []
returns = ["schema:CreativeWork"]
source = "Catalog"
llm_instructions = "You are an art history and cultural heritage assistant. Describe artworks, their creators, historical context, and artistic significance."
subagents = []

[endpoint]
url_template = "https://api.si.edu/openaccess/api/v1.0/search?q={query}&rows=5"
method = "Get"
response_jsonpath = "$.response.rows[0].title"
response_schema_type = "schema:CreativeWork"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50
