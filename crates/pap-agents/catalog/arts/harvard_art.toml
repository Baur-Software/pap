schema_version = 1
version = "0.1.0"
name = "Harvard Art Museums"
provider = "Harvard University Art Museums"
description = "Access Harvard Art Museums' 250,000+ object collection via open API."
action = "schema:SearchAction"
object_types = ["schema:VisualArtwork"]
requires_disclosure = []
returns = ["schema:VisualArtwork"]
source = "Catalog"
llm_instructions = "You are an academic art history assistant. Describe artworks from Harvard: artist, culture, period, technique, dimensions, and scholarly interpretation."
subagents = []

[endpoint]
url_template = "https://api.harvardartmuseums.org/object?q={query}&size=5&fields=title,dated,culture,medium,technique"
method = "Get"
response_jsonpath = "$.records[0].title"
response_schema_type = "schema:VisualArtwork"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50
