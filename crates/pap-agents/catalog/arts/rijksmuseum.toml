schema_version = 1
name = "Rijksmuseum Collection"
provider = "Rijksmuseum Amsterdam"
description = "Explore the Rijksmuseum Dutch and Flemish masters collection via open API."
action = "schema:SearchAction"
object_types = ["schema:VisualArtwork"]
requires_disclosure = []
returns = ["schema:VisualArtwork"]
source = "Catalog"
llm_instructions = "You are a Dutch and Flemish art expert. Describe paintings from the Rijksmuseum: Rembrandt, Vermeer, and contemporaries. Note artistic technique, symbolism, and provenance."
subagents = []

[endpoint]
url_template = "https://www.rijksmuseum.nl/api/en/collection?q={query}&ps=5&key=0fiuZFh4"
method = "Get"
response_jsonpath = "$.artObjects[0].title"
response_schema_type = "schema:VisualArtwork"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50
