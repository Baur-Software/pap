schema_version = 1
name = "Congress.gov Votes"
provider = "Congress.gov"
description = "Search congressional votes and roll call records via Congress.gov API."
action = "schema:SearchAction"
object_types = ["schema:LegislationObject"]
requires_disclosure = []
returns = ["schema:LegislationObject"]
source = "Catalog"
llm_instructions = "You are a government and public records assistant. Provide factual information about legislation, policy, and government data."
subagents = []

[endpoint]
url_template = "https://api.congress.gov/v3/vote?q={query}&limit=5&api_key=demo"
method = "Get"
response_jsonpath = "$.votes.vote[0].description"
response_schema_type = "schema:LegislationObject"
