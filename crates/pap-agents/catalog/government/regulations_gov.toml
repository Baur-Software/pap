schema_version = 1
version = "0.1.0"
name = "Regulations.gov Comments"
provider = "Regulations.gov"
description = "Search federal regulations and public comment records."
action = "schema:SearchAction"
object_types = ["schema:LegislationObject"]
requires_disclosure = []
returns = ["schema:LegislationObject"]
source = "Catalog"
llm_instructions = "You are a government and public records assistant. Provide factual information about legislation, policy, and government data."
subagents = []

[endpoint]
url_template = "https://api.regulations.gov/v4/documents?filter[searchTerm]={query}&page[size]=5"
method = "Get"
response_jsonpath = "$.data[0].attributes.title"
response_schema_type = "schema:LegislationObject"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50
