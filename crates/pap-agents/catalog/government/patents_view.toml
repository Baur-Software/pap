schema_version = 1
version = "0.1.0"
name = "USPTO PatentsView"
provider = "USPTO"
description = "Search US patents by inventor, assignee, or technology via PatentsView API."
action = "schema:SearchAction"
object_types = ["schema:CreativeWork"]
requires_disclosure = []
returns = ["schema:CreativeWork"]
source = "Catalog"
llm_instructions = "You are a patent research assistant. Provide patent title, number, assignee, inventor, filing date, and abstract. Note technology category and citation count."
subagents = []

[endpoint]
url_template = "https://search.patentsview.org/api/v1/patent/?q=%7B%22_text_phrase%22%3A%7B%22patent_title%22%3A%22{query}%22%7D%7D&f=%5B%22patent_title%22%2C%22patent_number%22%2C%22patent_date%22%5D&o=%7B%22per_page%22%3A5%7D"
method = "Get"
response_jsonpath = "$.patents[0].patent_title"
response_schema_type = "schema:CreativeWork"
