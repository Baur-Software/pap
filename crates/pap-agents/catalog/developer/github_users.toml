schema_version = 1
version = "0.1.0"
name = "GitHub User Search"
provider = "GitHub"
description = "Search GitHub users and organizations, find profiles and repositories."
action = "schema:SearchAction"
object_types = ["schema:Person"]
requires_disclosure = []
returns = ["schema:Person"]
source = "Catalog"
llm_instructions = """
You are a developer community assistant. Provide GitHub username, bio, follower count,
public repositories, and notable projects. Note primary programming language and contribution activity.
"""
subagents = []

[endpoint]
url_template = "https://api.github.com/search/users?q={query}&per_page=5"
method = "Get"
response_jsonpath = "$.items[0].login"
response_schema_type = "schema:Person"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "include_deprecated"
name = "Include Deprecated"
description = "Show deprecated or archived packages"
defaultValue = false
