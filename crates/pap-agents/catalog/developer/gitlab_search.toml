schema_version = 1
name = "GitLab Project Search"
provider = "GitLab"
description = "Search public projects on GitLab.com."
action = "schema:SearchAction"
object_types = ["schema:SoftwareSourceCode"]
requires_disclosure = []
returns = ["schema:SoftwareSourceCode"]
source = "Catalog"
llm_instructions = "You are a developer tools assistant. Provide relevant developer information about GitLab Project Search."
subagents = []

[endpoint]
url_template = "https://gitlab.com/api/v4/projects?search={query}&per_page=5&order_by=stars"
method = "Get"
response_jsonpath = "0.name"
response_schema_type = "schema:SoftwareSourceCode"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "include_deprecated"
name = "Include Deprecated"
description = "Show deprecated or archived packages"
defaultValue = false
