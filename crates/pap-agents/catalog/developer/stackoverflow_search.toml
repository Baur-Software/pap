schema_version = 1
name = "Stack Overflow Question Search"
provider = "Stack Exchange"
description = "Search Stack Overflow questions and answers via the Stack Exchange API."
action = "schema:SearchAction"
object_types = ["schema:Question"]
requires_disclosure = []
returns = ["schema:QAPage"]
source = "Catalog"
llm_instructions = """
You are a programming Q&A assistant. Provide question title, answer count, vote score,
tags, and key solution approaches. Summarize accepted answers clearly and concisely.
"""
subagents = []

[endpoint]
url_template = "https://api.stackexchange.com/2.3/search?order=desc&sort=relevance&intitle={query}&site=stackoverflow&pagesize=5"
method = "Get"
response_jsonpath = "$.items[0].title"
response_schema_type = "schema:QAPage"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "sort_by"
name = "Sort Order"
description = "How to order results"
defaultValue = "relevance"
valuePattern = "relevance|stars|updated|downloads"

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "include_deprecated"
name = "Include Deprecated"
description = "Show deprecated or archived packages"
defaultValue = false
