schema_version = 1
version = "0.1.0"
name = "GitHub Trending Repositories"
provider = "GitHub Trending / Unofficial"
description = "Discover trending GitHub repositories by language or topic."
action = "schema:SearchAction"
object_types = ["schema:SoftwareSourceCode"]
requires_disclosure = ["lang"]
returns = ["schema:SoftwareSourceCode"]
source = "Catalog"
llm_instructions = """
You are a software trend discovery assistant. Describe repositories that are currently
popular on GitHub. Include name, language, stars, and a brief description of the project.
"""
subagents = []

[endpoint]
url_template = "https://api.github.com/search/repositories?q={query}+language:{lang}&sort=stars&order=desc&per_page=5"
method = "Get"
response_jsonpath = "$.items[0].full_name"
response_schema_type = "schema:SoftwareSourceCode"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "sort_by"
name = "Sort Order"
description = "How to order results"
defaultValue = "stars"
valuePattern = "relevance|stars|updated|downloads"

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "include_deprecated"
name = "Include Deprecated"
description = "Show deprecated or archived packages"
defaultValue = false
