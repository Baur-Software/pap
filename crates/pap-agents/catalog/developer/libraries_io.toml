schema_version = 1
name = "Libraries.io Package Search"
provider = "Libraries.io"
description = "Search open source packages across all major package managers via Libraries.io."
action = "schema:SearchAction"
object_types = ["schema:SoftwareApplication"]
requires_disclosure = []
returns = ["schema:SoftwareApplication"]
source = "Catalog"
llm_instructions = """
You are a multi-ecosystem software dependency assistant. Provide package name, platform
(npm/PyPI/Cargo/etc), latest version, dependent projects count, and repository URL.
"""
subagents = []

[endpoint]
url_template = "https://libraries.io/api/search?q={query}&per_page=5"
method = "Get"
response_jsonpath = "$[0].name"
response_schema_type = "schema:SoftwareApplication"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "include_deprecated"
name = "Include Deprecated"
description = "Show deprecated or archived packages"
defaultValue = false
