schema_version = 1
name = "RubyGems Search"
provider = "RubyGems.org"
description = "Search Ruby gems on RubyGems.org with download counts and documentation."
action = "schema:SearchAction"
object_types = ["schema:SoftwareApplication"]
requires_disclosure = []
returns = ["schema:SoftwareApplication"]
source = "Catalog"
llm_instructions = """
You are a Ruby ecosystem assistant. Provide gem name, version, description, total downloads,
license, authors, and Gemfile installation line. Note Rails compatibility if applicable.
"""
subagents = []

[endpoint]
url_template = "https://rubygems.org/api/v1/search.json?query={query}&page=1"
method = "Get"
response_jsonpath = "$[0].name"
response_schema_type = "schema:SoftwareApplication"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "include_deprecated"
name = "Include Deprecated"
description = "Show deprecated or archived packages"
defaultValue = false
