schema_version = 1
version = "0.1.0"
name = "Packagist PHP Search"
provider = "Packagist.org"
description = "Search PHP Composer packages on the official PHP package registry."
action = "schema:SearchAction"
object_types = ["schema:SoftwareApplication"]
requires_disclosure = []
returns = ["schema:SoftwareApplication"]
source = "Catalog"
llm_instructions = """
You are a PHP ecosystem assistant. Provide package vendor/name, description, downloads,
latest version, and Composer install command. Note Laravel/Symfony compatibility if relevant.
"""
subagents = []

[endpoint]
url_template = "https://packagist.org/search.json?q={query}&per_page=5"
method = "Get"
response_jsonpath = "$.results[0].name"
response_schema_type = "schema:SoftwareApplication"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "include_deprecated"
name = "Include Deprecated"
description = "Show deprecated or archived packages"
defaultValue = false
