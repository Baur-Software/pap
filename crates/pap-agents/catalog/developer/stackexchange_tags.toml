schema_version = 1
name = "Stack Exchange Tag Search"
provider = "Stack Exchange"
description = "Search developer tags and topics across Stack Exchange network sites."
action = "schema:SearchAction"
object_types = ["schema:DefinedTerm"]
requires_disclosure = []
returns = ["schema:DefinedTerm"]
source = "Catalog"
llm_instructions = """
You are a developer knowledge assistant. Explain what a given technology tag means in context,
how many questions use it, and the key sub-topics it covers on Stack Overflow.
"""
subagents = []

[endpoint]
url_template = "https://api.stackexchange.com/2.3/tags?inname={query}&site=stackoverflow&pagesize=5&order=desc&sort=popular"
method = "Get"
response_jsonpath = "$.items[0].name"
response_schema_type = "schema:DefinedTerm"
