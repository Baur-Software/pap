schema_version = 1
version = "0.1.0"
name = "MusicBrainz Release Search"
provider = "MusicBrainz"
description = "Search music albums and releases via MusicBrainz open music encyclopedia."
action = "schema:SearchAction"
object_types = ["schema:MusicAlbum"]
requires_disclosure = []
returns = ["schema:MusicAlbum"]
source = "Catalog"
llm_instructions = """
You are a music album information assistant. Provide release title, artist, label,
release date, track count, format, and genre. Note if it's a studio album, live, or compilation.
"""
subagents = []

[endpoint]
url_template = "https://musicbrainz.org/ws/2/release/?query={query}&fmt=json&limit=5"
method = "Get"
response_jsonpath = "$.releases[0].title"
response_schema_type = "schema:MusicAlbum"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "include_adult_content"
name = "Include Adult Content"
description = "Show results that may contain mature content"
defaultValue = false
