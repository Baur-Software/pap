schema_version = 1
name = "TMDB Movie Search"
provider = "The Movie Database"
description = "Search movies, get ratings, cast, and release info via The Movie Database public API."
action = "schema:SearchAction"
object_types = ["schema:Movie"]
requires_disclosure = []
returns = ["schema:Movie"]
source = "Catalog"
llm_instructions = """
You are a film information assistant. The user is looking for information about a movie.
Provide the title, year, synopsis, director, and notable cast. Note genre, rating, and awards.
Keep responses concise and factual.
"""
subagents = []

[endpoint]
url_template = "https://api.themoviedb.org/3/search/movie?query={query}&language=en-US&page=1"
method = "Get"
response_jsonpath = "$.results[0].title"
response_schema_type = "schema:Movie"
