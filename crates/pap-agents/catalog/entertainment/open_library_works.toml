schema_version = 1
version = "0.1.0"
name = "Open Library Works Search"
provider = "Internet Archive / Open Library"
description = "Search books and literary works via Open Library's works API."
action = "schema:SearchAction"
object_types = ["schema:Book"]
requires_disclosure = []
returns = ["schema:Book"]
source = "Catalog"
llm_instructions = """
You are a book information assistant. Provide title, author, publication year, ISBN,
publisher, subject, and a brief synopsis. Open Library aims to catalog every book ever published.
"""
subagents = []

[endpoint]
url_template = "https://openlibrary.org/search.json?q={query}&fields=title,author_name,first_publish_year,isbn&limit=5"
method = "Get"
response_jsonpath = "$.docs[0].title"
response_schema_type = "schema:Book"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "include_adult_content"
name = "Include Adult Content"
description = "Show results that may contain mature content"
defaultValue = false
