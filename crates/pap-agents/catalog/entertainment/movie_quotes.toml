schema_version = 1
version = "0.1.0"
name = "Movie Quote Search"
provider = "MovieQuotes API"
description = "Search famous movie and TV quotes by film or character."
action = "schema:SearchAction"
object_types = ["schema:Quotation"]
requires_disclosure = []
returns = ["schema:Quotation"]
source = "Catalog"
llm_instructions = "You are an entertainment information assistant. Provide relevant details about the requested movie_quotes including key facts and context."
subagents = []

[endpoint]
url_template = "https://api.moviequotes.app/v1/quotes?search={query}&limit=5"
method = "Get"
response_jsonpath = "$.quotes[0].content"
response_schema_type = "schema:Quotation"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "include_adult_content"
name = "Include Adult Content"
description = "Show results that may contain mature content"
defaultValue = false
