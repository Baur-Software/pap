schema_version = 1
name = "SoundCloud Track Search"
provider = "SoundCloud"
description = "Search music tracks and podcasts on SoundCloud."
action = "schema:SearchAction"
object_types = ["schema:MusicRecording"]
requires_disclosure = []
returns = ["schema:AudioObject"]
source = "Catalog"
llm_instructions = "You are an entertainment information assistant. Provide relevant details about the requested soundcloud_search including key facts and context."
subagents = []

[endpoint]
url_template = "https://api-v2.soundcloud.com/search/tracks?q={query}&limit=5"
method = "Get"
response_jsonpath = "$.collection[0].title"
response_schema_type = "schema:AudioObject"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "include_adult_content"
name = "Include Adult Content"
description = "Show results that may contain mature content"
defaultValue = false
