schema_version = 1
version = "0.1.0"
name = "Lyrics.ovh Search"
provider = "Lyrics.ovh"
description = "Fetch song lyrics by artist and title via the Lyrics.ovh free API."
action = "schema:SearchAction"
object_types = ["schema:MusicRecording"]
requires_disclosure = ["artist", "title"]
returns = ["schema:LyricsObject"]
source = "Catalog"
llm_instructions = """
You are a lyrics assistant. When given an artist and song title, provide the full lyrics.
If you don't have them, describe the song's themes, mood, and artistic significance.
"""
subagents = []

[endpoint]
url_template = "https://api.lyrics.ovh/v1/{artist}/{title}"
method = "Get"
response_jsonpath = "$.lyrics"
response_schema_type = "schema:LyricsObject"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "include_adult_content"
name = "Include Adult Content"
description = "Show results that may contain mature content"
defaultValue = false
