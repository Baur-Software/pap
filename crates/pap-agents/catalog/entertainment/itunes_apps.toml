schema_version = 1
version = "0.1.0"
name = "iTunes App Search"
provider = "Apple"
description = "Search iOS and macOS apps in the Apple App Store."
action = "schema:SearchAction"
object_types = ["schema:MobileApplication"]
requires_disclosure = []
returns = ["schema:MobileApplication"]
source = "Catalog"
llm_instructions = "You are an entertainment information assistant. Provide relevant details about the requested itunes_apps including key facts and context."
subagents = []

[endpoint]
url_template = "https://itunes.apple.com/search?term={query}&media=software&limit=5"
method = "Get"
response_jsonpath = "$.results[0].trackName"
response_schema_type = "schema:MobileApplication"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "include_adult_content"
name = "Include Adult Content"
description = "Show results that may contain mature content"
defaultValue = false
