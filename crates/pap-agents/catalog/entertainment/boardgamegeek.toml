schema_version = 1
version = "0.1.0"
name = "BoardGameGeek Search"
provider = "BoardGameGeek"
description = "Search board games and tabletop games via BoardGameGeek XML API."
action = "schema:SearchAction"
object_types = ["schema:Game"]
requires_disclosure = []
returns = ["schema:Game"]
source = "Catalog"
llm_instructions = """
You are a board game information assistant. Provide game name, publisher, year, player count,
play time, age rating, and a brief description. Note genre, mechanics, and community rating.
"""
subagents = []

[endpoint]
url_template = "https://www.boardgamegeek.com/xmlapi2/search?query={query}&type=boardgame"
method = "Get"
response_jsonpath = "$.items.item[0].name.$.value"
response_schema_type = "schema:Game"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "include_adult_content"
name = "Include Adult Content"
description = "Show results that may contain mature content"
defaultValue = false
