schema_version = 1
version = "0.1.0"
name = "Rhyme Finder"
provider = "Datamuse"
description = "Find words that rhyme with any given word via Datamuse phonetic matching."
action = "schema:SearchAction"
object_types = ["schema:DefinedTerm"]
requires_disclosure = []
returns = ["schema:DefinedTerm"]
source = "Catalog"
llm_instructions = "You are a poetry and creative writing assistant. Provide rhyming words with scores and usage frequency. Suggest near-rhymes too."
subagents = []

[endpoint]
url_template = "https://api.datamuse.com/words?rel_rhy={query}&max=10"
method = "Get"
response_jsonpath = "$[0].word"
response_schema_type = "schema:DefinedTerm"
