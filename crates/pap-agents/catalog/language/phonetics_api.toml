schema_version = 1
version = "0.1.0"
name = "IPA Phonetics"
provider = "EasyPronounce API"
description = "Get phonetic transcriptions and pronunciation guides in IPA."
action = "schema:FindAction"
object_types = ["schema:DefinedTerm"]
requires_disclosure = []
returns = ["schema:DefinedTerm"]
source = "Catalog"
llm_instructions = "You are a language and linguistics assistant for IPA Phonetics. Provide accurate language information with cultural and historical context."
subagents = []

[endpoint]
url_template = "https://api.dictionaryapi.dev/api/v2/entries/en/{query}"
method = "Get"
response_jsonpath = "0.phonetics[0].text"
response_schema_type = "schema:DefinedTerm"
