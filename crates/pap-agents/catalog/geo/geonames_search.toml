schema_version = 1
name = "GeoNames Gazetteer"
provider = "GeoNames"
description = "Search the GeoNames geographic database for cities, mountains, rivers, and places."
action = "schema:SearchAction"
object_types = ["schema:Place"]
requires_disclosure = []
returns = ["schema:Place"]
source = "Catalog"
llm_instructions = "You are a geographic information assistant. Provide place name, country, population, elevation, timezone, and geographic coordinates."
subagents = []

[endpoint]
url_template = "https://secure.geonames.org/searchJSON?q={query}&maxRows=5&username=demo"
method = "Get"
response_jsonpath = "$.geonames[0].name"
response_schema_type = "schema:Place"
