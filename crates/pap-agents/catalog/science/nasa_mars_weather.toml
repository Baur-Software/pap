schema_version = 1
version = "0.1.0"
name = "Mars Weather"
provider = "NASA InSight"
description = "Get weather conditions on Mars from NASA InSight lander data."
action = "schema:FindAction"
object_types = ["schema:WeatherForecast"]
requires_disclosure = []
returns = ["schema:WeatherForecast"]
source = "Catalog"
llm_instructions = "You are a scientific information assistant for Mars Weather. Provide accurate, well-contextualized scientific information."
subagents = []

[endpoint]
url_template = "https://api.nasa.gov/insight_weather/?api_key=DEMO_KEY&feedtype=json&ver=1.0"
method = "Get"
response_jsonpath = "$.sol_keys[0]"
response_schema_type = "schema:WeatherForecast"
