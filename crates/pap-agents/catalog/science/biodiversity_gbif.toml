schema_version = 1
version = "0.1.0"
name = "GBIF Biodiversity"
provider = "Global Biodiversity Information Facility"
description = "Search biodiversity occurrence records from GBIF open data."
action = "schema:SearchAction"
object_types = ["schema:Taxon"]
requires_disclosure = []
returns = ["schema:Taxon"]
source = "Catalog"
llm_instructions = "You are a scientific information assistant for GBIF Biodiversity. Provide accurate, well-contextualized scientific information."
subagents = []

[endpoint]
url_template = "https://api.gbif.org/v1/species/search?q={query}&limit=5"
method = "Get"
response_jsonpath = "$.results[0].scientificName"
response_schema_type = "schema:Taxon"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50
