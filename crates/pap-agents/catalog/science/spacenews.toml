schema_version = 1
name = "Space News Articles"
provider = "Spaceflight News API"
description = "Get latest space exploration and astronomy news from major space news sources."
action = "schema:SearchAction"
object_types = ["schema:NewsArticle"]
requires_disclosure = []
returns = ["schema:NewsArticle"]
source = "Catalog"
llm_instructions = "You are a space exploration and astronomy news assistant. Summarize space news stories: mission updates, scientific discoveries, and industry developments."
subagents = []

[endpoint]
url_template = "https://api.spaceflightnewsapi.net/v4/articles?search={query}&limit=5"
method = "Get"
response_jsonpath = "$.results[0].title"
response_schema_type = "schema:NewsArticle"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50
