schema_version = 1
version = "0.1.0"
name = "NOAA Climate Data"
provider = "NOAA"
description = "Access historical climate records and normals via NOAA Climate Data Online."
action = "schema:FindAction"
object_types = ["schema:Dataset"]
requires_disclosure = []
returns = ["schema:Dataset"]
source = "Catalog"
llm_instructions = "You are a scientific information assistant for NOAA Climate Data. Provide accurate, well-contextualized scientific information."
subagents = []

[endpoint]
url_template = "https://www.ncdc.noaa.gov/cdo-web/api/v2/data?datasetid=GHCND&stationid=GHCND:USW00094728&limit=5"
method = "Get"
response_jsonpath = "$.results[0].value"
response_schema_type = "schema:Dataset"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50
