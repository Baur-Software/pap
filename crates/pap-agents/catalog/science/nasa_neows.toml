schema_version = 1
version = "0.1.0"
name = "Near Earth Objects"
provider = "NASA NeoWs"
description = "Get near-Earth asteroid data from NASA Near Earth Object Web Service."
action = "schema:FindAction"
object_types = ["schema:Event"]
requires_disclosure = ["api_key"]
returns = ["schema:Event"]
source = "Catalog"
llm_instructions = "You are a scientific information assistant for Near Earth Objects. Provide accurate, well-contextualized scientific information."
subagents = []

[endpoint]
url_template = "https://api.nasa.gov/neo/rest/v1/feed?api_key={api_key}&start_date={date}"
method = "Get"
response_jsonpath = "$.near_earth_objects"
response_schema_type = "schema:Event"

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "api_key"
name = "API Key"
description = "Your NASA API key"
defaultValue = ""
