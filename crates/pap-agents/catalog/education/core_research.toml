schema_version = 1
version = "0.1.0"
name = "CORE Research Papers"
provider = "CORE"
description = "Search 200M+ open access research papers via the CORE academic aggregator."
action = "schema:SearchAction"
object_types = ["schema:ScholarlyArticle"]
requires_disclosure = []
returns = ["schema:ScholarlyArticle"]
source = "Catalog"
llm_instructions = "You are a research discovery assistant. Provide title, authors, abstract, year, and download link."
subagents = []

[endpoint]
url_template = "https://api.core.ac.uk/v3/search/works?q={query}&limit=5"
method = "Get"
response_jsonpath = "$.results[0].title"
response_schema_type = "schema:ScholarlyArticle"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "open_access_only"
name = "Open Access Only"
description = "Only return freely accessible publications"
defaultValue = false
