schema_version = 1
version = "0.1.0"
name = "Khan Academy Exercises"
provider = "Khan Academy"
description = "Find learning exercises and lessons on Khan Academy by topic."
action = "schema:SearchAction"
object_types = ["schema:LearningResource"]
requires_disclosure = []
returns = ["schema:LearningResource"]
source = "Catalog"
llm_instructions = "You are an educational content assistant. Provide course details, learning objectives, and curriculum information for Khan Academy Exercises."
subagents = []

[endpoint]
url_template = "https://www.khanacademy.org/api/v1/topic/{query}"
method = "Get"
response_jsonpath = "$.translated_title"
response_schema_type = "schema:LearningResource"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "open_access_only"
name = "Open Access Only"
description = "Only return freely accessible publications"
defaultValue = false
