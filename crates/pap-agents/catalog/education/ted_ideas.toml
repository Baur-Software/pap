schema_version = 1
version = "0.1.0"
name = "TED Ideas Articles"
provider = "TED"
description = "Explore TED Ideas written articles on science, technology, and culture."
action = "schema:SearchAction"
object_types = ["schema:Article"]
requires_disclosure = []
returns = ["schema:Article"]
source = "Catalog"
llm_instructions = "You are an educational content assistant. Provide course details, learning objectives, and curriculum information for TED Ideas Articles."
subagents = []

[endpoint]
url_template = "https://ideas.ted.com/wp-json/wp/v2/posts?search={query}&per_page=5"
method = "Get"
response_jsonpath = "0.title.rendered"
response_schema_type = "schema:Article"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "open_access_only"
name = "Open Access Only"
description = "Only return freely accessible publications"
defaultValue = false
