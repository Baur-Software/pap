schema_version = 1
name = "DOAJ Open Access Articles"
provider = "Directory of Open Access Journals"
description = "Search peer-reviewed open access articles in the Directory of Open Access Journals."
action = "schema:SearchAction"
object_types = ["schema:ScholarlyArticle"]
requires_disclosure = []
returns = ["schema:ScholarlyArticle"]
source = "Catalog"
llm_instructions = "You are an open access research assistant. Provide article title, authors, journal, and link to full text."
subagents = []

[endpoint]
url_template = "https://doaj.org/api/search/articles/{query}?pageSize=5"
method = "Get"
response_jsonpath = "$.results[0].bibjson.title"
response_schema_type = "schema:ScholarlyArticle"
