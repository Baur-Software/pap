schema_version = 1
version = "0.1.0"
name = "edX Course Catalog"
provider = "edX"
description = "Browse online courses from top universities via the edX catalog."
action = "schema:SearchAction"
object_types = ["schema:Course"]
requires_disclosure = []
returns = ["schema:Course"]
source = "Catalog"
llm_instructions = "You are an educational content assistant. Provide course details, learning objectives, and curriculum information for edX Course Catalog."
subagents = []

[endpoint]
url_template = "https://api.edx.org/catalog/v1/catalogs/1/courses/?q={query}&page_size=5"
method = "Get"
response_jsonpath = "$.results[0].title"
response_schema_type = "schema:Course"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "open_access_only"
name = "Open Access Only"
description = "Only return freely accessible publications"
defaultValue = false
