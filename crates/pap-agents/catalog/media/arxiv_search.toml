schema_version = 1
name = "arXiv Preprint Search"
provider = "arXiv / Cornell"
description = "Search preprint papers in physics, CS, math, and biology on arXiv."
action = "schema:SearchAction"
object_types = ["schema:ScholarlyArticle"]
requires_disclosure = []
returns = ["schema:ScholarlyArticle"]
source = "Catalog"
llm_instructions = "You are a media and journalism assistant. Provide relevant news, articles, and content summaries from arXiv / Cornell."
subagents = []

[endpoint]
url_template = "https://export.arxiv.org/api/query?search_query=all:{query}&max_results=5"
method = "Get"
response_jsonpath = "$.feed.entry[0].title"
response_schema_type = "schema:ScholarlyArticle"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "include_adult_content"
name = "Include Adult Content"
description = "Show results that may contain mature content"
defaultValue = false
