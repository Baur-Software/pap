schema_version = 1
name = "BBC World News"
provider = "BBC"
description = "Get international news headlines and reports from BBC World Service."
action = "schema:FindAction"
object_types = ["schema:NewsArticle"]
requires_disclosure = []
returns = ["schema:NewsArticle"]
source = "Catalog"
