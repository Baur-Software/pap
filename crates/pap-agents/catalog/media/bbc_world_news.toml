schema_version = 1
version = "0.1.0"
name = "BBC World News"
provider = "BBC"
description = "Get international news headlines and reports from BBC World Service."
action = "schema:FindAction"
object_types = ["schema:NewsArticle"]
requires_disclosure = ["api_key"]
returns = ["schema:NewsArticle"]
source = "Catalog"
llm_instructions = "You are a media and journalism assistant. Provide relevant news, articles, and content summaries from BBC."
subagents = []

[endpoint]
url_template = "https://newsapi.org/v2/top-headlines?sources=bbc-news&apiKey={api_key}&pageSize=5"
method = "Get"
response_jsonpath = "$.articles[0].title"
response_schema_type = "schema:NewsArticle"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "include_adult_content"
name = "Include Adult Content"
description = "Show results that may contain mature content"
defaultValue = false

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "api_key"
name = "API Key"
description = "Your NewsAPI.org API key"
defaultValue = ""
