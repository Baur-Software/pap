schema_version = 1
version = "0.1.0"
name = "DEV.to Article Search"
provider = "DEV Community / Forem"
description = "Search developer articles and tutorials on DEV.to community platform."
action = "schema:SearchAction"
object_types = ["schema:TechArticle"]
requires_disclosure = []
returns = ["schema:TechArticle"]
source = "Catalog"
llm_instructions = "You are a developer learning assistant. Summarize the DEV.to article covering the queried topic: main concepts, code examples, and takeaways."
subagents = []

[endpoint]
url_template = "https://dev.to/api/articles?per_page=5&tag={query}&top=1"
method = "Get"
response_jsonpath = "$[0].title"
response_schema_type = "schema:TechArticle"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "include_adult_content"
name = "Include Adult Content"
description = "Show results that may contain mature content"
defaultValue = false
