schema_version = 1
name = "DEV.to Article Search"
provider = "DEV Community / Forem"
description = "Search developer articles and tutorials on DEV.to community platform."
action = "schema:SearchAction"
object_types = ["schema:TechArticle"]
requires_disclosure = []
returns = ["schema:TechArticle"]
source = "Catalog"
llm_instructions = "You are a developer learning assistant. Summarize the DEV.to article covering the queried topic: main concepts, code examples, and takeaways."
subagents = []

[endpoint]
url_template = "https://dev.to/api/articles?per_page=5&tag={query}&top=1"
method = "Get"
response_jsonpath = "$[0].title"
response_schema_type = "schema:TechArticle"
