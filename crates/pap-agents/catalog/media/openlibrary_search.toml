schema_version = 1
name = "Open Library Book Search"
provider = "Internet Archive"
description = "Search the Internet Archive Open Library catalog of millions of books."
action = "schema:SearchAction"
object_types = ["schema:Book"]
requires_disclosure = []
returns = ["schema:Book"]
source = "Catalog"
llm_instructions = "You are a book catalog assistant. Provide title, author, publication year, subject, and availability on Internet Archive."
subagents = []

[endpoint]
url_template = "https://openlibrary.org/search.json?q={query}&limit=5"
method = "Get"
response_jsonpath = "$.docs[0].title"
response_schema_type = "schema:Book"
