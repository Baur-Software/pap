schema_version = 1
version = "0.1.0"
name = "Mediastack Live News"
provider = "Mediastack"
description = "Get live news from 7,500+ global news sources via Mediastack."
action = "schema:SearchAction"
object_types = ["schema:NewsArticle"]
requires_disclosure = ["api_key"]
returns = ["schema:NewsArticle"]
source = "Catalog"
llm_instructions = "You are a media and journalism assistant. Provide relevant news, articles, and content summaries from Mediastack."
subagents = []

[endpoint]
url_template = "https://api.mediastack.com/v1/news?access_key={api_key}&keywords={query}&limit=5"
method = "Get"
response_jsonpath = "$.data[0].title"
response_schema_type = "schema:NewsArticle"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "include_adult_content"
name = "Include Adult Content"
description = "Show results that may contain mature content"
defaultValue = false

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "api_key"
name = "API Key"
description = "Your Mediastack API key"
defaultValue = ""
