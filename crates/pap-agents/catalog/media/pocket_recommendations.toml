schema_version = 1
name = "Pocket Article Recommendations"
provider = "Pocket / Mozilla"
description = "Find recommended long-form articles via Pocket's discovery API."
action = "schema:SearchAction"
object_types = ["schema:Article"]
requires_disclosure = []
returns = ["schema:Article"]
source = "Catalog"
llm_instructions = "You are a media and journalism assistant. Provide relevant news, articles, and content summaries from Pocket / Mozilla."
subagents = []

[endpoint]
url_template = "https://getpocket.com/v3/get?consumer_key=demo&access_token=demo&tag={query}&count=5"
method = "Get"
response_jsonpath = "$.list"
response_schema_type = "schema:Article"
