schema_version = 1
version = "0.1.0"
name = "Pocket Article Recommendations"
provider = "Pocket / Mozilla"
description = "Find recommended long-form articles via Pocket's discovery API."
action = "schema:SearchAction"
object_types = ["schema:Article"]
requires_disclosure = ["api_key", "access_token"]
returns = ["schema:Article"]
source = "Catalog"
llm_instructions = "You are a media and journalism assistant. Provide relevant news, articles, and content summaries from Pocket / Mozilla."
subagents = []

[endpoint]
url_template = "https://getpocket.com/v3/get?consumer_key={api_key}&access_token={access_token}&tag={query}&count=5"
method = "Get"
response_jsonpath = "$.list"
response_schema_type = "schema:Article"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "include_adult_content"
name = "Include Adult Content"
description = "Show results that may contain mature content"
defaultValue = false

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "api_key"
name = "Consumer Key"
description = "Your Pocket consumer key"
defaultValue = ""

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "access_token"
name = "Access Token"
description = "Your Pocket access token"
defaultValue = ""
