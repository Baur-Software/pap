schema_version = 1
name = "NYT Best Sellers"
provider = "New York Times"
description = "Get New York Times bestseller lists by category."
action = "schema:FindAction"
object_types = ["schema:Book"]
requires_disclosure = []
returns = ["schema:Book"]
source = "Catalog"
llm_instructions = "You are a media and journalism assistant. Provide relevant news, articles, and content summaries from New York Times."
subagents = []

