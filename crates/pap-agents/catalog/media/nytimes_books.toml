schema_version = 1
version = "0.1.0"
name = "NYT Best Sellers"
provider = "New York Times"
description = "Get New York Times bestseller lists by category."
action = "schema:FindAction"
object_types = ["schema:Book"]
requires_disclosure = ["api_key"]
returns = ["schema:Book"]
source = "Catalog"
llm_instructions = "You are a media and journalism assistant. Provide relevant news, articles, and content summaries from New York Times."
subagents = []

[endpoint]
url_template = "https://api.nytimes.com/svc/books/v3/lists/current/hardcover-fiction.json?api-key={api_key}"
method = "Get"
response_jsonpath = "$.results.books[0].title"
response_schema_type = "schema:Book"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "include_adult_content"
name = "Include Adult Content"
description = "Show results that may contain mature content"
defaultValue = false

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "api_key"
name = "API Key"
description = "Your New York Times API key"
defaultValue = ""
