schema_version = 1
version = "0.1.0"
name = "Radio Browser"
provider = "Radio-Browser.info"
description = "Search 30,000+ internet radio stations by name, language, genre, or country."
action = "schema:SearchAction"
object_types = ["schema:BroadcastService"]
requires_disclosure = []
returns = ["schema:BroadcastService"]
source = "Catalog"
llm_instructions = "You are a radio discovery assistant. Provide station name, country, language, genre, bitrate, and stream URL."
subagents = []

[endpoint]
url_template = "https://de1.api.radio-browser.info/json/stations/search?name={query}&limit=5&hidebroken=true"
method = "Get"
response_jsonpath = "$[0].name"
response_schema_type = "schema:BroadcastService"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "include_adult_content"
name = "Include Adult Content"
description = "Show results that may contain mature content"
defaultValue = false
