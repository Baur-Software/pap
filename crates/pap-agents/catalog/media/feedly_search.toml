schema_version = 1
version = "0.1.0"
name = "Feedly RSS Search"
provider = "Feedly"
description = "Search RSS feeds and publications via Feedly discovery API."
action = "schema:SearchAction"
object_types = ["schema:WebSite"]
requires_disclosure = []
returns = ["schema:WebSite"]
source = "Catalog"
llm_instructions = "You are a media and journalism assistant. Provide relevant news, articles, and content summaries from Feedly."
subagents = []

[endpoint]
url_template = "https://cloud.feedly.com/v3/search/feeds?query={query}&count=5"
method = "Get"
response_jsonpath = "$.results[0].title"
response_schema_type = "schema:WebSite"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "include_adult_content"
name = "Include Adult Content"
description = "Show results that may contain mature content"
defaultValue = false
