schema_version = 1
version = "0.1.0"
name = "Eventbrite Event Search"
provider = "Eventbrite"
description = "Search public events on Eventbrite by keyword, location, or category."
action = "schema:SearchAction"
object_types = ["schema:Event"]
requires_disclosure = []
returns = ["schema:Event"]
source = "Catalog"
llm_instructions = "You are an events assistant. Provide event name, organizer, date, location, price, and category. Note if online or in-person."
subagents = []

[endpoint]
url_template = "https://www.eventbriteapi.com/v3/events/search/?q={query}&expand=venue&page_size=5"
method = "Get"
response_jsonpath = "$.events[0].name.text"
response_schema_type = "schema:Event"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "include_adult_content"
name = "Include Adult Content"
description = "Show results that may contain mature content"
defaultValue = false
