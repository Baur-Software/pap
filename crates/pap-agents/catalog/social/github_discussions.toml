schema_version = 1
name = "GitHub Repository Search"
provider = "GitHub"
description = "Search GitHub repositories by topic, language, and popularity."
action = "schema:SearchAction"
object_types = ["schema:SoftwareSourceCode"]
requires_disclosure = []
returns = ["schema:SoftwareSourceCode"]
source = "Catalog"
llm_instructions = "You are a software discovery assistant. Describe open source repositories: name, description, language, stars, forks, and license."
subagents = []

[endpoint]
url_template = "https://api.github.com/search/repositories?q={query}+is:public&sort=stars&order=desc&per_page=5"
method = "Get"
response_jsonpath = "$.items[0].full_name"
response_schema_type = "schema:SoftwareSourceCode"
