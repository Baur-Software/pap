schema_version = 1
version = "0.1.0"
name = "Discord Bot Search"
provider = "Discord Bot List"
description = "Discover Discord bots with features, server count, and invite links via top.gg."
action = "schema:SearchAction"
object_types = ["schema:SoftwareApplication"]
requires_disclosure = []
returns = ["schema:SoftwareApplication"]
source = "Catalog"
llm_instructions = "You are a Discord community assistant. Describe Discord bots: name, purpose, commands, server count, and notable features."
subagents = []

[endpoint]
url_template = "https://top.gg/api/bots?search={query}&limit=5"
method = "Get"
response_jsonpath = "$.results[0].username"
response_schema_type = "schema:SoftwareApplication"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "include_adult_content"
name = "Include Adult Content"
description = "Show results that may contain mature content"
defaultValue = false
