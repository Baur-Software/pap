schema_version = 1
name = "Mastodon Account Search"
provider = "Mastodon"
description = "Search Mastodon user accounts and public profiles on the Fediverse."
action = "schema:SearchAction"
object_types = ["schema:Person"]
requires_disclosure = []
returns = ["schema:Person"]
source = "Catalog"
llm_instructions = "You are a social community assistant for Mastodon Account Search. Summarize community discussions, profiles, and contributions."
subagents = []

[endpoint]
url_template = "https://mastodon.social/api/v2/search?q={query}&type=accounts&limit=5"
method = "Get"
response_jsonpath = "$.accounts[0].display_name"
response_schema_type = "schema:Person"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "include_adult_content"
name = "Include Adult Content"
description = "Show results that may contain mature content"
defaultValue = false
