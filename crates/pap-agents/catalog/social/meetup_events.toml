schema_version = 1
name = "Meetup Event Search"
provider = "Meetup.com"
description = "Find local and virtual events and professional meetups on Meetup.com."
action = "schema:SearchAction"
object_types = ["schema:Event"]
requires_disclosure = []
returns = ["schema:Event"]
source = "Catalog"
llm_instructions = "You are an event discovery assistant. Provide event name, date, location, organizer group, attendee count, and description."
subagents = []

[endpoint]
url_template = "https://api.meetup.com/find/events?text={query}&page=5&order=time"
method = "Get"
response_jsonpath = "$[0].name"
response_schema_type = "schema:Event"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "sort_by"
name = "Sort Order"
description = "How to order results"
defaultValue = "time"
valuePattern = "time|relevance|recent|popular"

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "include_adult_content"
name = "Include Adult Content"
description = "Show results that may contain mature content"
defaultValue = false
