schema_version = 1
version = "0.1.0"
name = "GitHub Issues Search"
provider = "GitHub"
description = "Search issues and PRs across public GitHub repositories."
action = "schema:SearchAction"
object_types = ["schema:Comment"]
requires_disclosure = []
returns = ["schema:Comment"]
source = "Catalog"
llm_instructions = "You are a social community assistant for GitHub Issues Search. Summarize community discussions, profiles, and contributions."
subagents = []

[endpoint]
url_template = "https://api.github.com/search/issues?q={query}+is:issue&per_page=5"
method = "Get"
response_jsonpath = "$.items[0].title"
response_schema_type = "schema:Comment"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "include_adult_content"
name = "Include Adult Content"
description = "Show results that may contain mature content"
defaultValue = false
