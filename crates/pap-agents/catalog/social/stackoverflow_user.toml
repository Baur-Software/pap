schema_version = 1
version = "0.1.0"
name = "Stack Overflow User Search"
provider = "Stack Exchange"
description = "Search Stack Overflow user profiles and contribution statistics."
action = "schema:SearchAction"
object_types = ["schema:Person"]
requires_disclosure = []
returns = ["schema:Person"]
source = "Catalog"
llm_instructions = "You are a social community assistant for Stack Overflow User Search. Summarize community discussions, profiles, and contributions."
subagents = []

[endpoint]
url_template = "https://api.stackexchange.com/2.3/users?inname={query}&site=stackoverflow&pagesize=5&order=desc&sort=reputation"
method = "Get"
response_jsonpath = "$.items[0].display_name"
response_schema_type = "schema:Person"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "sort_by"
name = "Sort Order"
description = "How to order results"
defaultValue = "reputation"
valuePattern = "reputation|relevance|recent|popular"

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "include_adult_content"
name = "Include Adult Content"
description = "Show results that may contain mature content"
defaultValue = false
