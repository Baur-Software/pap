schema_version = 1
name = "GitHub Trending Today"
provider = "GitHub"
description = "Find trending GitHub repositories by topic using the GitHub search API."
action = "schema:SearchAction"
object_types = ["schema:SoftwareSourceCode"]
requires_disclosure = []
returns = ["schema:SoftwareSourceCode"]
source = "Catalog"
llm_instructions = "You are a software community trend assistant. Describe trending repositories: name, description, stars, language, and why it is gaining attention."
subagents = []

[endpoint]
url_template = "https://api.github.com/search/repositories?q={query}&sort=stars&order=desc&per_page=5"
method = "Get"
response_jsonpath = "$.items[0].full_name"
response_schema_type = "schema:SoftwareSourceCode"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "sort_by"
name = "Sort Order"
description = "How to order results"
defaultValue = "stars"
valuePattern = "stars|relevance|recent|popular"

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "include_adult_content"
name = "Include Adult Content"
description = "Show results that may contain mature content"
defaultValue = false
