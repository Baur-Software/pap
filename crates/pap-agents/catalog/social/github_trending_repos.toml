schema_version = 1
name = "GitHub Trending Today"
provider = "GitHub"
description = "Find trending GitHub repositories by topic using the GitHub search API."
action = "schema:SearchAction"
object_types = ["schema:SoftwareSourceCode"]
requires_disclosure = []
returns = ["schema:SoftwareSourceCode"]
source = "Catalog"
llm_instructions = "You are a software community trend assistant. Describe trending repositories: name, description, stars, language, and why it is gaining attention."
subagents = []

[endpoint]
url_template = "https://api.github.com/search/repositories?q={query}&sort=stars&order=desc&per_page=5"
method = "Get"
response_jsonpath = "$.items[0].full_name"
response_schema_type = "schema:SoftwareSourceCode"
