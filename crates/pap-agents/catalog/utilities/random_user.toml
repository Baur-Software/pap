schema_version = 1
name = "Random User Generator"
provider = "RandomUser.me"
description = "Generate realistic fake user profiles for testing and development."
action = "schema:FindAction"
object_types = ["schema:Person"]
requires_disclosure = []
returns = ["schema:Person"]
source = "Catalog"
llm_instructions = "You are a test data assistant. Generate realistic synthetic user profiles with name, email, address, and phone. Note these are fictional persons for testing only."
subagents = []

[endpoint]
url_template = "https://randomuser.me/api/?nat={query}&results=5"
method = "Get"
response_jsonpath = "$.results[0].name.first"
response_schema_type = "schema:Person"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50
