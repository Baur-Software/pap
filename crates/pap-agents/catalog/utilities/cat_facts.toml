schema_version = 1
name = "Cat Facts API"
provider = "Cat Facts"
description = "Get interesting and educational facts about cats."
action = "schema:FindAction"
object_types = ["schema:CreativeWork"]
requires_disclosure = []
returns = ["schema:CreativeWork"]
source = "Catalog"
llm_instructions = "You are a feline biology and behavior assistant. Provide interesting cat facts with scientific context, evolutionary background, and behavioral explanations."
subagents = []

[endpoint]
url_template = "https://catfact.ninja/facts?limit=5"
method = "Get"
response_jsonpath = "$.data[0].fact"
response_schema_type = "schema:CreativeWork"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50
