schema_version = 1
name = "ClinicalTrials.gov Search"
provider = "NIH / ClinicalTrials.gov"
description = "Search clinical trials by condition, intervention, or location via ClinicalTrials.gov API."
action = "schema:SearchAction"
object_types = ["schema:MedicalTrial"]
requires_disclosure = []
returns = ["schema:MedicalTrial"]
source = "Catalog"
llm_instructions = "You are a clinical research information assistant. Provide trial title, phase, status, sponsor, eligibility criteria, and enrollment count. Note primary endpoints."
subagents = []

[endpoint]
url_template = "https://clinicaltrials.gov/api/v2/studies?query.term={query}&pageSize=5"
method = "Get"
response_jsonpath = "$.studies[0].protocolSection.identificationModule.briefTitle"
response_schema_type = "schema:MedicalTrial"
