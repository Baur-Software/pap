schema_version = 1
name = "Visual Crossing Weather"
provider = "Visual Crossing"
description = "Historical and forecast weather data via Visual Crossing Timeline API."
action = "schema:FindAction"
object_types = ["schema:Place"]
requires_disclosure = []
returns = ["schema:WeatherForecast"]
source = "Catalog"
llm_instructions = "You are a weather history and forecast assistant. Provide current conditions and upcoming forecast, noting any significant weather patterns or records."
subagents = []

[endpoint]
url_template = "https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services/timeline/{query}?unitGroup=metric&key=DEMO&contentType=json"
method = "Get"
response_jsonpath = "$.currentConditions.conditions"
response_schema_type = "schema:WeatherForecast"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "units"
name = "Units"
description = "Measurement system for temperature and wind"
defaultValue = "metric"
valuePattern = "metric|imperial"
