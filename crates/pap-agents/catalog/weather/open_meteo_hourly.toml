schema_version = 1
version = "0.1.0"
name = "Open-Meteo Hourly Forecast"
provider = "Open-Meteo"
description = "Free 48-hour hourly weather forecast with temperature, precipitation, and wind."
action = "schema:FindAction"
object_types = ["schema:Place"]
requires_disclosure = ["lat", "lon"]
returns = ["schema:WeatherForecast"]
source = "Catalog"
llm_instructions = "You are a detailed hourly weather assistant. Break down the next 48 hours of weather: temperature per hour, precipitation windows, and wind changes."
subagents = []

[endpoint]
url_template = "https://api.open-meteo.com/v1/forecast?latitude={lat}&longitude={lon}&hourly=temperature_2m,precipitation,windspeed_10m&forecast_days=2&timezone=auto"
method = "Get"
response_jsonpath = "$.hourly.time[0]"
response_schema_type = "schema:WeatherForecast"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "forecast_days"
name = "Forecast Days"
description = "Number of days to forecast ahead"
defaultValue = 2
minValue = 1
maxValue = 16
