schema_version = 1
version = "0.1.0"
name = "Famous Quotes API"
provider = "They Said So / Quotable"
description = "Search famous quotes by author, topic, or keyword."
action = "schema:SearchAction"
object_types = ["schema:Quotation"]
requires_disclosure = []
returns = ["schema:Quotation"]
source = "Catalog"
llm_instructions = "You are a literary and philosophical quotes assistant. Provide quotes with author, source, year, and context. Suggest related quotes on similar themes."
subagents = []

[endpoint]
url_template = "https://api.quotable.io/search/quotes?query={query}&limit=5"
method = "Get"
response_jsonpath = "$.results[0].content"
response_schema_type = "schema:Quotation"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50
