schema_version = 1
version = "0.2.0"
name = "Flight Search"
provider = "DuckDuckGo"
description = "Search for flight prices and airline ticket information."
action = "schema:SearchAction"
object_types = ["schema:Flight"]
requires_disclosure = []
returns = ["schema:Flight"]
source = "Catalog"
llm_instructions = "You are a travel assistant helping users find flight information. The user is searching for: {query}. Provide helpful information about flights, typical price ranges, airlines that serve those routes, and booking tips. If the query includes airports or cities, mention common carriers and approximate travel times. Note that actual real-time prices require checking airline websites directly."
subagents = []

# No endpoint — falls through to LLM for flight information.
# The previous Skyscanner/RapidAPI endpoint required authentication headers
# ({from}, {to}, {date} parameters) that are not provided by the {query}
# substitution path, causing 'No Definitions Found' errors from the API.
