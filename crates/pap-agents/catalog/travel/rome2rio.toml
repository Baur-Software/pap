schema_version = 1
name = "Rome2rio Route Planner"
provider = "Rome2rio"
description = "Find travel routes by plane, train, bus, ferry from A to B."
action = "schema:FindAction"
object_types = ["schema:Trip"]
requires_disclosure = []
returns = ["schema:Trip"]
source = "Catalog"
llm_instructions = "You are a travel assistant. Provide helpful travel information about Rome2rio Route Planner: relevant details, tips, and context for travelers."
subagents = []

[endpoint]
url_template = "https://free.rome2rio.com/api/1.4/json/Search?key=demo&oName={origin}&dName={destination}"
method = "Get"
response_jsonpath = "$.routes[0].name"
response_schema_type = "schema:Trip"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "open_now"
name = "Open Now"
description = "Only show currently open venues"
defaultValue = false
