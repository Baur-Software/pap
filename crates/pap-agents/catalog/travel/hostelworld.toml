schema_version = 1
name = "Hostel Search"
provider = "Hostelworld"
description = "Search budget hostels and backpacker accommodations worldwide."
action = "schema:SearchAction"
object_types = ["schema:LodgingBusiness"]
requires_disclosure = []
returns = ["schema:LodgingBusiness"]
source = "Catalog"
llm_instructions = "You are a travel assistant. Provide helpful travel information about Hostel Search: relevant details, tips, and context for travelers."
subagents = []

[endpoint]
url_template = "https://api.hostelworld.com/v1/search?query={query}&page=1&limit=5"
method = "Get"
response_jsonpath = "$.properties[0].name"
response_schema_type = "schema:LodgingBusiness"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "open_now"
name = "Open Now"
description = "Only show currently open venues"
defaultValue = false
