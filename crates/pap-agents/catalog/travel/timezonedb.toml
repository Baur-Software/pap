schema_version = 1
version = "0.1.0"
name = "TimezoneDB"
provider = "TimezoneDB"
description = "Look up timezone information for any city or country including UTC offset and DST."
action = "schema:FindAction"
object_types = ["schema:Place"]
requires_disclosure = []
returns = ["schema:Event"]
source = "Catalog"
llm_instructions = """
You are a time zone and scheduling assistant. Provide timezone name, UTC offset, daylight
saving time dates, and the current local time for the requested city or region.
"""
subagents = []

[endpoint]
url_template = "https://api.timezonedb.com/v2.1/get-time-zone?key=DEMO&format=json&by=zone&zone={query}"
method = "Get"
response_jsonpath = "$.zoneName"
response_schema_type = "schema:Event"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "open_now"
name = "Open Now"
description = "Only show currently open venues"
defaultValue = false
