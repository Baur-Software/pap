schema_version = 1
version = "0.1.0"
name = "Transitland Transit Routes"
provider = "Transitland / Interline"
description = "Search public transit routes and schedules via Transitland API."
action = "schema:SearchAction"
object_types = ["schema:Trip"]
requires_disclosure = []
returns = ["schema:Trip"]
source = "Catalog"
llm_instructions = "You are a travel assistant. Provide helpful travel information about Transitland Transit Routes: relevant details, tips, and context for travelers."
subagents = []

[endpoint]
url_template = "https://transit.land/api/v2/rest/routes?search={query}&limit=5"
method = "Get"
response_jsonpath = "$.routes[0].long_name"
response_schema_type = "schema:Trip"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50

[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "open_now"
name = "Open Now"
description = "Only show currently open venues"
defaultValue = false
