schema_version = 1
name = "Product Hunt Daily"
provider = "Product Hunt"
description = "Get the daily top product launches on Product Hunt."
action = "schema:FindAction"
object_types = ["schema:Product"]
requires_disclosure = []
returns = ["schema:Product"]
source = "Catalog"
llm_instructions = "You are a business and commerce research assistant. Provide relevant product, market, and company information."
subagents = []

[endpoint]
url_template = "https://api.producthunt.com/v1/posts?category={query}&sort_by=votes_count"
method = "Get"
response_jsonpath = "$.posts[0].name"
response_schema_type = "schema:Product"
