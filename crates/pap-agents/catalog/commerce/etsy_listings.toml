schema_version = 1
version = "0.1.0"
name = "Etsy Shop Search"
provider = "Etsy"
description = "Search handmade, vintage, and craft items on Etsy marketplace."
action = "schema:SearchAction"
object_types = ["schema:Product"]
requires_disclosure = []
returns = ["schema:Product"]
source = "Catalog"
llm_instructions = "You are a handmade goods discovery assistant. Describe Etsy listings: product name, maker, materials, price, and craftsmanship details."
subagents = []

[endpoint]
url_template = "https://openapi.etsy.com/v3/application/listings/active?keywords={query}&limit=5"
method = "Get"
response_jsonpath = "$.results[0].title"
response_schema_type = "schema:Product"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50
