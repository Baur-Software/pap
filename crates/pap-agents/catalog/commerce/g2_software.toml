schema_version = 1
version = "0.1.0"
name = "G2 Software Reviews"
provider = "G2.com"
description = "Search software products and reviews on G2 business marketplace."
action = "schema:SearchAction"
object_types = ["schema:SoftwareApplication"]
requires_disclosure = []
returns = ["schema:SoftwareApplication"]
source = "Catalog"
llm_instructions = "You are a business and commerce research assistant. Provide relevant product, market, and company information."
subagents = []

[endpoint]
url_template = "https://data.g2.com/api/v1/products?filter[name]={query}&page[size]=5"
method = "Get"
response_jsonpath = "$.data[0].attributes.name"
response_schema_type = "schema:SoftwareApplication"

# Agent-advertised configurable properties (schema.org PropertyValueSpecification)
[[configurable_properties]]
"@type" = "PropertyValueSpecification"
valueName = "results_per_page"
name = "Results Per Page"
description = "Maximum number of results to return per query"
defaultValue = 5
minValue = 1
maxValue = 50
