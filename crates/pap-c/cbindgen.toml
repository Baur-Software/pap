language = "C"
include_guard = "PAP_H"
tab_width = 4
documentation = true
documentation_style = "c99"
documentation_length = "full"

# Emit a file-level header comment.
header = """
/**
 * pap.h — C API for the Principal Agent Protocol
 *
 * Auto-generated by cbindgen from crates/pap-c/src/lib.rs.
 * Do not edit manually — regenerate with: cargo build -p pap-c
 *
 * Memory contract:
 *   - Every pap_*_generate / pap_*_new / pap_*_from_* call returns a
 *     heap-allocated handle that the caller owns and must free with the
 *     corresponding pap_*_free function.
 *   - Strings returned by any pap_* function are heap-allocated C strings
 *     and must be freed with pap_string_free().
 *   - Input strings (*const char) and byte slices (*const uint8_t) are
 *     borrowed; ownership stays with the caller.
 *
 * Error handling:
 *   - Functions that can fail return NULL (pointer) or -1 (int).
 *   - Call pap_last_error_message() to obtain a description; the returned
 *     string must be freed with pap_string_free().
 */
"""

after_includes = """
#include <stdint.h>
#include <stddef.h>
"""

[export]
# Only export items that are #[no_mangle] pub extern "C".
include = []
exclude = []

[parse]
parse_deps = false
