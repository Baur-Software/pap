[package]
name = "pap-c"
description = "C FFI layer for the Principal Agent Protocol — foundation for C++, C#, and Java bindings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# cdylib  → shared library (.so / .dylib / .dll) for runtime linking (C++, C#, Java JNA)
# staticlib → static archive (.a / .lib) for link-time embedding
crate-type = ["cdylib", "staticlib"]

[dependencies]
pap-did         = { workspace = true }
pap-core        = { workspace = true }
pap-marketplace = { workspace = true }

chrono        = { workspace = true }
serde_json    = { workspace = true }
ed25519-dalek = { workspace = true }
base64        = { workspace = true }

[build-dependencies]
cbindgen = "0.27"
