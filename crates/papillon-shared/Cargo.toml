[package]
name = "papillon-shared"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# pap-agents is native-only: reqwest::blocking → tokio → mio does not compile for WASM
pap-agents = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

# Database abstraction - feature gated
rusqlite = { version = "0.32", features = ["bundled", "serde_json"], optional = true }

# WASM/IndexedDB dependencies - feature gated
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window", "Event", "EventTarget",
    "IdbFactory", "IdbDatabase", "IdbObjectStore",
    "IdbRequest", "IdbOpenDbRequest", "IdbKeyRange",
    "IdbTransaction", "IdbTransactionMode",
    "DomStringList", "DomException",
    "console",
] }
wasm-bindgen-futures = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3"

# Feature flags
[features]
default = ["native"]
native = ["rusqlite", "pap-agents"]
wasm = ["wasm-bindgen", "js-sys", "web-sys", "wasm-bindgen-futures", "uuid/js"]

[lints]
workspace = true
