[package]
name = "pap-credential-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Encrypted principal credential store for the Principal Agent Protocol"

[dependencies]
pap-did = { workspace = true }
pap-core = { workspace = true }
pap-webauthn = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
aes-gcm = { workspace = true }
argon2 = { version = "0.5", features = ["std"] }

# Native SQLite backend (optional)
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]

[dev-dependencies]
tempfile = "3"
