name: "PAP CodeQL Configuration"

# Suppress rust/hardcoded-credentials — structurally incompatible with crypto code.
#
# All flagged instances are false positives:
#   - [0u8; 32] zero-init buffers immediately filled by CSPRNG (standard Rust pattern)
#   - Test fixture passwords in #[cfg(test)] blocks ("test-pw", b"password")
#
# Other Rust security queries (cleartext-transmission, request-forgery, etc.) remain active.
query-filters:
  - exclude:
      id: rust/hardcoded-credentials
