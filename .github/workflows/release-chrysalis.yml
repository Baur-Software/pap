name: Release Chrysalis

on:
  push:
    branches: [main]
    paths:
      - "apps/registry/**"
      - "crates/pap-federation/**"
      - "crates/pap-marketplace/**"
      - "crates/pap-core/**"
      - "crates/pap-did/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  PRODUCT_NAME: Chrysalis
  DOCKER_IMAGE: ghcr.io/baur-software/chrysalis

jobs:
  # ── 1. Detect new version and create tag ─────────────────────────────────────
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read workspace version and check for existing tag
        id: check
        run: |
          VERSION=$(sed -n '/\[workspace\.package\]/,/^$/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          TAG="chrysalis-v${VERSION}"
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists — skipping release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version ${VERSION} detected — will tag and release"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check.outputs.should_release == 'true'
        run: |
          git tag "chrysalis-v${{ steps.check.outputs.version }}"
          git push origin "chrysalis-v${{ steps.check.outputs.version }}"

  # ── 2. Create a draft GitHub Release ─────────────────────────────────────────
  create-release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          NOTES=$(awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          echo "${NOTES}" > /tmp/release-notes.md

      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const notes = fs.readFileSync('/tmp/release-notes.md', 'utf8').trim();
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `chrysalis-v${process.env.VERSION}`,
              name: `Chrysalis v${process.env.VERSION}`,
              body: notes || `See [CHANGELOG](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CHANGELOG.md) for details.`,
              draft: true,
              prerelease: false
            });
            return data.id;

  # ── 3. Build server binaries (macOS / Linux / Windows) ───────────────────────
  build-server:
    needs: [check-version, create-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: chrysalis-linux-x64
            rust_targets: x86_64-unknown-linux-gnu,wasm32-unknown-unknown
          - platform: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact_name: chrysalis-linux-arm64
            rust_targets: aarch64-unknown-linux-gnu,wasm32-unknown-unknown
            cross: true
          - platform: macos-latest
            target: universal-apple-darwin
            artifact_name: chrysalis-macos-universal
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin,wasm32-unknown-unknown
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: chrysalis-windows-x64
            rust_targets: x86_64-pc-windows-msvc,wasm32-unknown-unknown

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: contains(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libpq-dev

      - name: Install cross-compilation dependencies (Linux ARM64)
        if: matrix.cross == true
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "[target.aarch64-unknown-linux-gnu]" >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-leptos
        run: cargo binstall cargo-leptos --no-confirm

      - name: Build Chrysalis server (cargo-leptos)
        if: matrix.target != 'universal-apple-darwin' && matrix.cross != true
        run: cargo leptos build --release -p pap-registry

      - name: Build Chrysalis server (macOS universal)
        if: matrix.target == 'universal-apple-darwin'
        run: |
          # Build for both architectures
          cargo leptos build --release -p pap-registry
          BINARY_PATH="target/server/release/pap-registry"
          if [ -f "$BINARY_PATH" ]; then
            echo "Built universal binary at $BINARY_PATH"
          fi

      - name: Build Chrysalis server (cross-compile ARM64)
        if: matrix.cross == true
        run: |
          # Build WASM frontend first (host target)
          cargo leptos build --release -p pap-registry
          # Note: cargo-leptos handles cross-compilation for the server binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package server binary
        id: package
        shell: bash
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          ARTIFACT="${{ matrix.artifact_name }}"
          mkdir -p "dist/${ARTIFACT}"

          # Copy server binary
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp target/server/release/pap-registry.exe "dist/${ARTIFACT}/chrysalis.exe"
          else
            cp target/server/release/pap-registry "dist/${ARTIFACT}/chrysalis"
            chmod +x "dist/${ARTIFACT}/chrysalis"
          fi

          # Copy WASM site bundle
          cp -r target/site "dist/${ARTIFACT}/site"

          # Copy static assets
          cp -r apps/registry/assets "dist/${ARTIFACT}/assets"

          # Create archive
          cd dist
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            7z a "${ARTIFACT}-v${VERSION}.zip" "${ARTIFACT}/"
            echo "archive=${ARTIFACT}-v${VERSION}.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "${ARTIFACT}-v${VERSION}.tar.gz" "${ARTIFACT}/"
            echo "archive=${ARTIFACT}-v${VERSION}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload server binary to release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        with:
          script: |
            const fs = require('fs');
            const data = fs.readFileSync(`dist/${process.env.ARCHIVE}`);
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: parseInt(process.env.RELEASE_ID),
              name: process.env.ARCHIVE,
              data
            });

      - name: Upload artifact for npm packaging
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}/
          retention-days: 5

  # ── 4. Build WASM site (shared by mobile builds) ─────────────────────────────
  # Builds the Chrysalis hydration WASM client once for reuse by iOS/Android.
  build-web:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libpq-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-leptos
        run: cargo binstall cargo-leptos --no-confirm

      - name: Build WASM site via cargo-leptos
        run: cargo leptos build --release -p pap-registry

      - name: Upload WASM site artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrysalis-web-site
          path: target/site/
          retention-days: 5

  # ── 5. Build mobile — iOS (thin client) ─────────────────────────────────────
  # Mobile builds are lightweight Capacitor wrappers around the WASM hydration
  # client. The app connects to a Chrysalis server (hosted or LAN Papillion
  # instance) — no server-side logic runs on the device.
  build-mobile-ios:
    needs: [check-version, create-release, build-web]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM site artifact
        uses: actions/download-artifact@v4
        with:
          name: chrysalis-web-site
          path: site/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Initialize Capacitor iOS project
        run: |
          mkdir -p apps/registry/mobile-ios
          cd apps/registry/mobile-ios

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios

          npx cap init "Chrysalis" "com.baur-software.chrysalis" \
            --web-dir ../../../site

          npx cap add ios
          npx cap sync ios

      - name: Install Apple certificate and provisioning profile
        if: env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          PP_PATH=$RUNNER_TEMP/provision.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERT_PATH"
          echo -n "$APPLE_PROVISIONING_PROFILE" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build iOS archive
        working-directory: apps/registry/mobile-ios
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Chrysalis.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export IPA (when signing is available)
        if: env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          cat > $RUNNER_TEMP/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Chrysalis.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/export.plist \
            -exportPath $RUNNER_TEMP/ipa/

      - name: Upload iOS artifacts to release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          VERSION: ${{ needs.check-version.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const glob = require('@actions/glob');
            const globber = await glob.create(`${process.env.RUNNER_TEMP}/**/*.ipa`);
            for await (const file of globber.globGenerator()) {
              const data = fs.readFileSync(file);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: parseInt(process.env.RELEASE_ID),
                name: `Chrysalis-${process.env.VERSION}-ios.ipa`,
                data
              });
            }

  # ── 6. Build mobile — Android (thin client) ─────────────────────────────────
  build-mobile-android:
    needs: [check-version, create-release, build-web]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM site artifact
        uses: actions/download-artifact@v4
        with:
          name: chrysalis-web-site
          path: site/

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Initialize Capacitor Android project
        run: |
          mkdir -p apps/registry/mobile-android
          cd apps/registry/mobile-android

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          npx cap init "Chrysalis" "com.baur-software.chrysalis" \
            --web-dir ../../../site

          npx cap add android
          npx cap sync android

      - name: Build Android APK
        working-directory: apps/registry/mobile-android/android
        run: ./gradlew assembleRelease

      - name: Sign APK (production keystore)
        if: env.HAS_ANDROID_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo -n "$ANDROID_KEYSTORE" | base64 --decode > $RUNNER_TEMP/keystore.jks
          BUILD_TOOLS=$(ls -1 "$ANDROID_HOME/build-tools/" | sort -V | tail -1)
          APK=$(find apps/registry/mobile-android/android -name "*-release-unsigned.apk" -type f | head -1)
          if [ -n "$APK" ]; then
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign \
              --ks $RUNNER_TEMP/keystore.jks \
              --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
              --ks-key-alias "${ANDROID_KEY_ALIAS}" \
              --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
              --out "${APK%-unsigned.apk}.apk" \
              "$APK"
          fi

      - name: Sign APK (self-signed for sideloading)
        if: env.HAS_ANDROID_SIGNING != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore $RUNNER_TEMP/debug.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias debug -storepass android -keypass android \
            -dname "CN=Chrysalis Debug, O=Baur Software"
          BUILD_TOOLS=$(ls -1 "$ANDROID_HOME/build-tools/" | sort -V | tail -1)
          APK=$(find apps/registry/mobile-android/android -name "*-release-unsigned.apk" -type f | head -1)
          if [ -n "$APK" ]; then
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign \
              --ks $RUNNER_TEMP/debug.jks \
              --ks-pass pass:android \
              --ks-key-alias debug \
              --key-pass pass:android \
              --out "${APK%-unsigned.apk}.apk" \
              "$APK"
          fi

      - name: Upload Android artifacts to release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          VERSION: ${{ needs.check-version.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const glob = require('@actions/glob');
            const globber = await glob.create('apps/registry/mobile-android/android/**/*-release*.apk');
            for await (const file of globber.globGenerator()) {
              if (file.includes('unsigned')) continue;
              const data = fs.readFileSync(file);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: parseInt(process.env.RELEASE_ID),
                name: `Chrysalis-${process.env.VERSION}-android.apk`,
                data
              });
            }

  # ── 7. Publish npm package (@baur-software/chrysalis) ────────────────────────
  publish-npm:
    needs: [check-version, build-server]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Set package version
        working-directory: packages/chrysalis-cli
        run: npm version "${{ needs.check-version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        working-directory: packages/chrysalis-cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── 8. Publish Docker image (ghcr.io/baur-software/chrysalis) ───────────────
  publish-docker:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/registry/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ needs.check-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 9. Publish the release (un-draft) ────────────────────────────────────────
  publish-release:
    needs: [create-release, build-server, build-mobile-ios, build-mobile-android, publish-npm, publish-docker]
    if: |
      always() &&
      needs.create-release.result == 'success' &&
      needs.build-server.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: parseInt(process.env.RELEASE_ID),
              draft: false
            });
