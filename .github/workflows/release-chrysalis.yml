name: Release Chrysalis

on:
  push:
    branches: [main]
    paths:
      - "apps/registry/**"
      - "crates/pap-federation/**"
      - "crates/pap-marketplace/**"
      - "crates/pap-core/**"
      - "crates/pap-did/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  PRODUCT_NAME: Chrysalis
  DOCKER_IMAGE: ghcr.io/baur-software/chrysalis

jobs:
  # ── 1. Detect new version and create tag ─────────────────────────────────────
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read workspace version and check for existing tag
        id: check
        run: |
          VERSION=$(sed -n '/\[workspace\.package\]/,/^$/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          TAG="chrysalis-v${VERSION}"
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists — skipping release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version ${VERSION} detected — will tag and release"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check.outputs.should_release == 'true'
        run: |
          git tag "chrysalis-v${{ steps.check.outputs.version }}"
          git push origin "chrysalis-v${{ steps.check.outputs.version }}"

  # ── 2. Create a draft GitHub Release ─────────────────────────────────────────
  create-release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          NOTES=$(awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          echo "${NOTES}" > /tmp/release-notes.md

      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const notes = fs.readFileSync('/tmp/release-notes.md', 'utf8').trim();
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `chrysalis-v${process.env.VERSION}`,
              name: `Chrysalis v${process.env.VERSION}`,
              body: notes || `See [CHANGELOG](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CHANGELOG.md) for details.`,
              draft: true,
              prerelease: false
            });
            return data.id;

  # ── 3. Build server binaries (macOS / Linux / Windows) ───────────────────────
  build-server:
    needs: [check-version, create-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: chrysalis-linux-x64
            rust_targets: x86_64-unknown-linux-gnu,wasm32-unknown-unknown
          - platform: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact_name: chrysalis-linux-arm64
            rust_targets: aarch64-unknown-linux-gnu,wasm32-unknown-unknown
            cross: true
          - platform: macos-latest
            target: universal-apple-darwin
            artifact_name: chrysalis-macos-universal
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin,wasm32-unknown-unknown
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: chrysalis-windows-x64
            rust_targets: x86_64-pc-windows-msvc,wasm32-unknown-unknown

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: contains(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libpq-dev

      - name: Install cross-compilation dependencies (Linux ARM64)
        if: matrix.cross == true
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "[target.aarch64-unknown-linux-gnu]" >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-leptos
        run: cargo binstall cargo-leptos --no-confirm --force

      - name: Build Chrysalis server (cargo-leptos)
        if: matrix.target != 'universal-apple-darwin' && matrix.cross != true
        run: cargo leptos build --release -p pap-registry

      - name: Build Chrysalis server (macOS universal)
        if: matrix.target == 'universal-apple-darwin'
        run: |
          # Build for both architectures
          cargo leptos build --release -p pap-registry
          BINARY_PATH="target/release/pap-registry"
          if [ -f "$BINARY_PATH" ]; then
            echo "Built universal binary at $BINARY_PATH"
          fi

      - name: Build Chrysalis server (cross-compile ARM64)
        if: matrix.cross == true
        run: |
          # Build WASM frontend first (host target)
          cargo leptos build --release -p pap-registry
          # Note: cargo-leptos handles cross-compilation for the server binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package server binary
        id: package
        shell: bash
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          ARTIFACT="${{ matrix.artifact_name }}"
          mkdir -p "dist/${ARTIFACT}"

          # Copy server binary
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp target/release/pap-registry.exe "dist/${ARTIFACT}/chrysalis.exe"
          else
            cp target/release/pap-registry "dist/${ARTIFACT}/chrysalis"
            chmod +x "dist/${ARTIFACT}/chrysalis"
          fi

          # Copy WASM site bundle
          cp -r target/site "dist/${ARTIFACT}/site"

          # Copy static assets
          cp -r apps/registry/assets "dist/${ARTIFACT}/assets"

          # Create archive
          cd dist
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            7z a "${ARTIFACT}-v${VERSION}.zip" "${ARTIFACT}/"
            echo "archive=${ARTIFACT}-v${VERSION}.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "${ARTIFACT}-v${VERSION}.tar.gz" "${ARTIFACT}/"
            echo "archive=${ARTIFACT}-v${VERSION}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload server binary to release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        with:
          script: |
            const fs = require('fs');
            const data = fs.readFileSync(`dist/${process.env.ARCHIVE}`);
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: parseInt(process.env.RELEASE_ID),
              name: process.env.ARCHIVE,
              data
            });

      - name: Upload artifact for npm packaging
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}/
          retention-days: 5

  # ── 4. Publish npm package (@baur-software/chrysalis) ────────────────────────
  publish-npm:
    needs: [check-version, build-server]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Set package version
        working-directory: packages/chrysalis-cli
        run: npm version "${{ needs.check-version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        working-directory: packages/chrysalis-cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── 5. Publish Docker image (ghcr.io/baur-software/chrysalis) ───────────────
  publish-docker:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/registry/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ needs.check-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 6. Publish the release (un-draft) ────────────────────────────────────────
  publish-release:
    needs: [create-release, build-server, publish-npm, publish-docker]
    if: |
      needs.create-release.result == 'success' &&
      needs.build-server.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: parseInt(process.env.RELEASE_ID),
              draft: false
            });
