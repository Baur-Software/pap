name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      code: ${{ steps.filter.outputs.code }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'crates/**'
              - 'apps/**'
              - 'examples/**'
              - 'benches/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            e2e:
              - 'e2e/**'
              - 'apps/papillon/frontend/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libibverbs-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "native"
          cache-on-failure: true
      - run: cargo check --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libibverbs-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "native"
          cache-on-failure: true
      - run: cargo test --workspace

  test-registry:
    name: Test (registry SSR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libpq-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "registry-ssr"
          cache-on-failure: true
      - run: cargo test -p pap-registry --features ssr

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libibverbs-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "native"
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  build-extension:
    name: Build (browser extension)
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      always() &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true')
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "native"
          cache-on-failure: true
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Cache wasm-pack binary
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ hashFiles('crates/pap-wasm/Cargo.lock') }}
          restore-keys: wasm-pack-${{ runner.os }}-
      - name: Install wasm-pack
        run: cargo binstall wasm-pack --no-confirm
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install npm dependencies
        working-directory: apps/papillon-extension
        run: npm install
      - name: Build extension WASM
        working-directory: apps/papillon-extension
        run: npm run build:wasm
      - name: Build extension bundle
        working-directory: apps/papillon-extension
        run: npm run build
      - name: Assert dist exists
        run: |
          [ -d apps/papillon-extension/dist ] && [ "$(ls -A apps/papillon-extension/dist)" ] \
            && echo "Extension dist OK" \
            || { echo "::error::Extension dist missing or empty"; exit 1; }

  registry-probe:
    name: Registry smoke (startup probe)
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      always() &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true')
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libpq-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "registry-ssr"
          cache-on-failure: true
      - name: Pre-build registry binary
        run: cargo build -p pap-registry --features ssr
      - name: Start registry and probe health endpoint
        run: |
          PAP_REGISTRY_NO_TLS=true cargo run -p pap-registry --bin pap-registry --features ssr &
          pid=$!
          for i in $(seq 1 120); do
            curl -sf http://localhost:7890/federation/identity >/dev/null 2>&1 && \
              { echo "Registry started successfully"; kill $pid; exit 0; }
            kill -0 $pid 2>/dev/null || { echo "::error::registry process died"; exit 1; }
            sleep 1
          done
          echo "::error::registry did not start within 2m"
          kill $pid 2>/dev/null || true
          exit 1

  run-example:
    name: Run example (pap-search-example)
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      always() &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true')
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "native"
          cache-on-failure: true
      - name: Run search example
        run: cargo run -p pap-search-example

  docker-workspace:
    name: Docker workspace consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Dockerfile workspace members
        run: bash ci/check-docker-workspace.sh

  build-wasm:
    name: Build WASM (Papillon frontend)
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      always() &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.e2e == 'true')
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "smoke-wasm"
          cache-on-failure: true
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Cache trunk binary
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/trunk
          key: trunk-${{ runner.os }}-${{ hashFiles('apps/papillon/frontend/Cargo.lock') }}
          restore-keys: trunk-${{ runner.os }}-
      - name: Install trunk
        run: cargo binstall trunk --no-confirm
      - name: Build frontend (release WASM)
        run: cd apps/papillon/frontend && trunk build --release
      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: papillon-frontend-dist
          path: apps/papillon/frontend/dist/
          retention-days: 1

  build-registry-image:
    name: Build registry Docker image
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      always() &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.e2e == 'true')
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build registry image (with GHA layer cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/registry/Dockerfile
          target: runtime
          push: false
          load: true
          tags: pap-registry:ci
          cache-from: type=gha,scope=pap-registry-ci
          cache-to: type=gha,scope=pap-registry-ci,mode=max

      - name: Export image as compressed tarball
        run: docker save pap-registry:ci | zstd -T0 -3 -o /tmp/pap-registry-ci.tar.zst

      - name: Upload registry image artifact
        uses: actions/upload-artifact@v7
        with:
          name: pap-registry-ci-image
          path: /tmp/pap-registry-ci.tar.zst
          retention-days: 1

  bench:
    name: Benchmark (regression gate)
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      always() &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true')
    permissions:
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev python3
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "native"
          cache-on-failure: true

      # On PRs: fetch baseline artifact from latest successful main CI run
      - name: Download baseline from main
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --workflow=ci.yml \
            --branch=main \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
            echo "Downloading baseline from run $RUN_ID"
            gh run download "$RUN_ID" --name bench-baseline --dir .bench-baseline || true
          fi
          if [ -f .bench-baseline/baseline.json ]; then
            echo "BENCH_BASELINE=.bench-baseline/baseline.json" >> "$GITHUB_ENV"
            echo "Using artifact baseline from main"
          else
            echo "BENCH_BASELINE=benches/baseline.json" >> "$GITHUB_ENV"
            echo "No artifact baseline found; falling back to committed baseline.json"
          fi

      - name: Set baseline path (push)
        if: github.event_name == 'push'
        run: echo "BENCH_BASELINE=benches/baseline.json" >> "$GITHUB_ENV"

      - name: Run benchmarks
        run: cargo bench -p pap-bench

      - name: Check for p50 regressions (>10% vs baseline)
        run: bash benches/check_regression.sh --baseline "$BENCH_BASELINE" --output bench-results.txt

      # On main push: update baseline and upload as artifact for future PRs
      - name: Update baseline from current results
        if: (success() || failure()) && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash benches/check_regression.sh --update-baseline

      - name: Upload benchmark baseline
        if: (success() || failure()) && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: bench-baseline
          path: benches/baseline.json
          retention-days: 90

      # On PRs: post benchmark summary as a comment
      - name: Post benchmark summary on PR
        if: github.event_name == 'pull_request' && (success() || failure())
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let body = '### Benchmark Regression Report\n\n';
            try {
              const results = fs.readFileSync('bench-results.txt', 'utf8');
              body += '```\n' + results + '\n```\n';
            } catch (e) {
              body += '_Benchmark results not available._\n';
            }
            body += '\n<sub>Threshold: 10% regression vs baseline from main</sub>';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const marker = '### Benchmark Regression Report';
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.startsWith(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  test-java-bindings:
    name: Test (Java JNA bindings)
    runs-on: ubuntu-latest
    # TODO: add JDK 21 matrix (strategy.matrix.java: [17, 21]) once
    # the Gradle build is validated against JDK 21 on all platforms.
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "java-bindings"
          cache-on-failure: true
      - name: Build native library
        run: cargo build -p pap-c
      - name: Set library filename
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "LIB_NAME=libpap_c.dylib" >> $GITHUB_ENV
          elif [ "$RUNNER_OS" = "Windows" ]; then
            echo "LIB_NAME=pap_c.dll" >> $GITHUB_ENV
          else
            echo "LIB_NAME=libpap_c.so" >> $GITHUB_ENV
          fi
      - name: Verify native library exists
        run: ls -lh target/debug/$LIB_NAME
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'
      - name: Run Java integration tests
        working-directory: bindings/java
        run: gradle test

  smoke-test:
    name: Smoke Test (Papillon Desktop App)
    runs-on: ubuntu-latest
    needs: [changes, build-wasm]
    if: |
      always() &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.e2e == 'true') &&
      needs.build-wasm.result == 'success'
    steps:
      - uses: actions/checkout@v6
      - name: Download frontend dist artifact
        uses: actions/download-artifact@v8
        with:
          name: papillon-frontend-dist
          path: apps/papillon/frontend/dist/
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json', 'e2e/package.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install chromium --with-deps
      - name: Run smoke tests
        working-directory: e2e
        run: npx playwright test tests/smoke.spec.ts --workers=1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7

  chrysalis-e2e-tier2:
    name: E2E Tier 2 (Chrysalis functional tests)
    runs-on: ubuntu-latest
    needs: [changes, build-wasm, build-registry-image]
    if: |
      always() &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.e2e == 'true') &&
      needs.build-wasm.result == 'success' &&
      needs.build-registry-image.result == 'success'
    env:
      CHRYSALIS_PORT: "7890"
    steps:
      - uses: actions/checkout@v6

      - name: Download registry image artifact
        uses: actions/download-artifact@v8
        with:
          name: pap-registry-ci-image
          path: /tmp

      - name: Load registry image
        run: zstd -d /tmp/pap-registry-ci.tar.zst --stdout | docker load

      - name: Start Chrysalis registry (no-TLS, plain HTTP)
        run: |
          docker run -d \
            --name chrysalis-tier2 \
            -p $CHRYSALIS_PORT:$CHRYSALIS_PORT \
            -e PAP_REGISTRY_NO_TLS=true \
            -e PAP_REGISTRY_PORT=$CHRYSALIS_PORT \
            -e PAP_REGISTRY_HOST=0.0.0.0 \
            -e PAP_REGISTRY_ENDPOINT=http://localhost:$CHRYSALIS_PORT \
            pap-registry:ci

      - name: Wait for Chrysalis to be ready
        run: |
          echo "Waiting for registry to become healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:$CHRYSALIS_PORT/federation/identity > /dev/null 2>&1; then
              echo "Registry is ready (attempt $i)"
              break
            fi
            echo "Attempt $i/30: not ready yet, sleeping 2s..."
            sleep 2
          done
          # Final check — fail fast if still not up
          curl -sf http://localhost:$CHRYSALIS_PORT/federation/identity | head -c 200

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache-tier2
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json', 'e2e/package.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Run Tier 2 functional tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost:${{ env.CHRYSALIS_PORT }}
        run: npx playwright test tests/tier2-functional.spec.ts --workers=1 --reporter=line

      - name: Dump Chrysalis logs on failure
        if: failure()
        run: docker logs chrysalis-tier2

      - name: Stop Chrysalis container
        if: always()
        run: docker rm -f chrysalis-tier2 || true

      - name: Upload Tier 2 test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chrysalis-tier2-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7

  chrysalis-e2e:
    name: Chrysalis Integration Tests
    runs-on: ubuntu-latest
    needs: [changes, build-wasm]
    if: |
      always() &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.e2e == 'true') &&
      needs.build-wasm.result == 'success'
    steps:
      - uses: actions/checkout@v6
      - name: Download frontend dist artifact
        uses: actions/download-artifact@v8
        with:
          name: papillon-frontend-dist
          path: apps/papillon/frontend/dist/

      # ── Node.js + Playwright ──────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json', 'e2e/package.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright + wait-on
        working-directory: e2e
        run: |
          npm install
          npx playwright install chromium --with-deps

      # ── Chrysalis CI image (lean SSR-only build, no WASM bundle) ──────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Chrysalis CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: e2e/Dockerfile.ci-chrysalis
          push: false
          load: true
          tags: chrysalis-ci:latest
          cache-from: type=gha,scope=chrysalis-ci
          cache-to: type=gha,scope=chrysalis-ci,mode=max

      # ── Start Chrysalis + wait for health ─────────────────────────────────
      - name: Start Chrysalis container
        run: |
          docker run -d \
            --name chrysalis-ci \
            -p 8080:8080 \
            chrysalis-ci:latest
      - name: Wait for Chrysalis to be healthy
        working-directory: e2e
        run: npx wait-on http://localhost:8080/federation/identity --timeout 60000

      # ── Run Chrysalis integration tests ───────────────────────────────────
      - name: Run Chrysalis integration tests
        working-directory: e2e
        env:
          CHRYSALIS_URL: http://localhost:8080
        run: npx playwright test tests/chrysalis-integration.spec.ts --workers=1

      - name: Run Tier 3 canary tests
        working-directory: e2e
        env:
          CHRYSALIS_URL: http://localhost:8080
        run: npx playwright test tests/canary.spec.ts --workers=1 --reporter=line

      # ── Diagnostics + artifacts ───────────────────────────────────────────
      - name: Dump Chrysalis container logs
        if: always()
        run: docker logs chrysalis-ci || true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chrysalis-e2e-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
