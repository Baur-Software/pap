name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "native"
          cache-on-failure: true
      - run: cargo check --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "native"
          cache-on-failure: true
      - run: cargo test --workspace

  test-registry:
    name: Test (registry SSR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libpq-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "registry-ssr"
          cache-on-failure: true
      - run: cargo test -p pap-registry --features ssr

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "native"
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  justfile:
    name: Justfile recipes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config libpq-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "native"
          cache-on-failure: true
      - name: Install tools
        run: |
          curl -fsSL https://just.systems/install.sh | bash -s -- --to ~/.cargo/bin
          cargo install cargo-binstall
          cargo binstall -y --no-confirm wasm-pack cargo-audit trunk tauri-cli
      # ── Setup ──
      - name: just setup
        run: just setup
      # ── Quality ──
      - name: just lint
        run: just lint
      - name: just fmt (verify idempotent)
        run: just fmt && git diff --exit-code
      - name: just audit
        run: just audit
      # ── Test ──
      - name: just test
        run: just test
      - name: just test-crate pap-did
        run: just test-crate pap-did
      - name: just test-registry
        run: just test-registry
      # ── Build ──
      - name: just build
        run: just build
      # ── Services (start, probe, stop) ──
      - name: just registry-local
        run: |
          just registry-local &
          pid=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:7890/federation/identity >/dev/null 2>&1 && break
            [ "$i" -eq 30 ] && { echo "::error::registry did not start"; kill $pid; exit 1; }
            sleep 1
          done
          echo "Registry started successfully"
          kill $pid
      - name: just extension
        run: |
          just extension &
          pid=$!
          # Wait for vite to produce dist/ (wasm bootstrap + npm install + build can take minutes)
          for i in $(seq 1 90); do
            [ -d apps/papillon-extension/dist ] && break
            kill -0 $pid 2>/dev/null || { echo "::error::extension process died"; exit 1; }
            sleep 2
          done
          [ -d apps/papillon-extension/dist ] \
            && echo "Extension built successfully" \
            || { echo "::error::extension build timed out"; kill $pid 2>/dev/null; exit 1; }
          kill $pid 2>/dev/null || true
      # ── Utilities ──
      - name: just run-example
        run: just run-example pap-search-example
      - name: just clean
        run: just clean
      # ── Skipped (require display) ──
      # just papillon — needs Tauri GUI / display server
      # just dev — needs display (Papillon component)
      # just registry — TLS variant; registry-local covers the code path

  docker-workspace:
    name: Docker workspace consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Dockerfile workspace members
        run: bash ci/check-docker-workspace.sh

  bench:
    name: Benchmark (regression gate)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev python3
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "native"
          cache-on-failure: true

      # On PRs: fetch baseline artifact from latest successful main CI run
      - name: Download baseline from main
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --workflow=ci.yml \
            --branch=main \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
            echo "Downloading baseline from run $RUN_ID"
            gh run download "$RUN_ID" --name bench-baseline --dir .bench-baseline || true
          fi
          if [ -f .bench-baseline/baseline.json ]; then
            echo "BENCH_BASELINE=.bench-baseline/baseline.json" >> "$GITHUB_ENV"
            echo "Using artifact baseline from main"
          else
            echo "BENCH_BASELINE=benches/baseline.json" >> "$GITHUB_ENV"
            echo "No artifact baseline found; falling back to committed baseline.json"
          fi

      - name: Set baseline path (push)
        if: github.event_name == 'push'
        run: echo "BENCH_BASELINE=benches/baseline.json" >> "$GITHUB_ENV"

      - name: Run benchmarks
        run: cargo bench -p pap-bench

      - name: Check for p50 regressions (>10% vs baseline)
        run: bash benches/check_regression.sh --baseline "$BENCH_BASELINE" --output bench-results.txt

      # On main push: update baseline and upload as artifact for future PRs
      - name: Update baseline from current results
        if: (success() || failure()) && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash benches/check_regression.sh --update-baseline

      - name: Upload benchmark baseline
        if: (success() || failure()) && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: bench-baseline
          path: benches/baseline.json
          retention-days: 90

      # On PRs: post benchmark summary as a comment
      - name: Post benchmark summary on PR
        if: github.event_name == 'pull_request' && (success() || failure())
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '### Benchmark Regression Report\n\n';
            try {
              const results = fs.readFileSync('bench-results.txt', 'utf8');
              body += '```\n' + results + '\n```\n';
            } catch (e) {
              body += '_Benchmark results not available._\n';
            }
            body += '\n<sub>Threshold: 10% regression vs baseline from main</sub>';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const marker = '### Benchmark Regression Report';
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.startsWith(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  test-java-bindings:
    name: Test (Java JNA bindings)
    runs-on: ubuntu-latest
    # TODO: add JDK 21 matrix (strategy.matrix.java: [17, 21]) once
    # the Gradle build is validated against JDK 21 on all platforms.
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "java-bindings"
          cache-on-failure: true
      - name: Build native library
        run: cargo build --release -p pap-c
      - name: Set library filename
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "LIB_NAME=libpap_c.dylib" >> $GITHUB_ENV
          elif [ "$RUNNER_OS" = "Windows" ]; then
            echo "LIB_NAME=pap_c.dll" >> $GITHUB_ENV
          else
            echo "LIB_NAME=libpap_c.so" >> $GITHUB_ENV
          fi
      - name: Verify native library exists
        run: ls -lh target/release/$LIB_NAME
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Run Java integration tests
        working-directory: bindings/java
        run: gradle test

  smoke-test:
    name: Smoke Test (Papillon Desktop App)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "smoke-wasm"
          cache-on-failure: true
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Cache trunk binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/trunk
          key: trunk-${{ runner.os }}-${{ hashFiles('apps/papillon/frontend/Cargo.lock') }}
          restore-keys: trunk-${{ runner.os }}-
      - name: Install trunk
        run: cargo binstall trunk --no-confirm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json', 'e2e/package.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install chromium --with-deps
      - name: Build frontend (release WASM)
        run: cd apps/papillon/frontend && trunk build --release
      - name: Inspect dist output
        run: |
          echo "=== dist directory listing ==="
          ls -lah apps/papillon/frontend/dist/
          echo "=== generated index.html ==="
          cat apps/papillon/frontend/dist/index.html
          echo ""
          echo "=== WASM file size ==="
          ls -lh apps/papillon/frontend/dist/*.wasm 2>/dev/null || echo "No .wasm files found"
          echo "=== JS files ==="
          ls -lh apps/papillon/frontend/dist/*.js 2>/dev/null || echo "No .js files found"
      - name: Run smoke tests
        working-directory: e2e
        run: npx playwright test tests/smoke.spec.ts --workers=1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7

  chrysalis-e2e-tier2:
    name: E2E Tier 2 (Chrysalis functional tests)
    runs-on: ubuntu-latest
    # Run after the existing smoke test so the Docker layer cache is warm.
    needs: [smoke-test]
    env:
      CHRYSALIS_PORT: "7890"
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libpq-dev curl

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Chrysalis registry image
        run: |
          docker build \
            -f apps/registry/Dockerfile \
            --target runtime \
            -t pap-registry:ci \
            .

      - name: Start Chrysalis registry (no-TLS, plain HTTP)
        run: |
          docker run -d \
            --name chrysalis-tier2 \
            -p $CHRYSALIS_PORT:$CHRYSALIS_PORT \
            -e PAP_REGISTRY_NO_TLS=true \
            -e PAP_REGISTRY_PORT=$CHRYSALIS_PORT \
            -e PAP_REGISTRY_HOST=0.0.0.0 \
            -e PAP_REGISTRY_ENDPOINT=http://localhost:$CHRYSALIS_PORT \
            pap-registry:ci

      - name: Wait for Chrysalis to be ready
        run: |
          echo "Waiting for registry to become healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:$CHRYSALIS_PORT/federation/identity > /dev/null 2>&1; then
              echo "Registry is ready (attempt $i)"
              break
            fi
            echo "Attempt $i/30: not ready yet, sleeping 2s..."
            sleep 2
          done
          # Final check — fail fast if still not up
          curl -sf http://localhost:$CHRYSALIS_PORT/federation/identity | head -c 200

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache-tier2
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json', 'e2e/package.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Run Tier 2 functional tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost:${{ env.CHRYSALIS_PORT }}
        run: npx playwright test tests/tier2-functional.spec.ts --workers=1 --reporter=line

      - name: Dump Chrysalis logs on failure
        if: failure()
        run: docker logs chrysalis-tier2

      - name: Stop Chrysalis container
        if: always()
        run: docker rm -f chrysalis-tier2 || true

      - name: Upload Tier 2 test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrysalis-tier2-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7

  chrysalis-e2e:
    name: Chrysalis Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Rust + WASM toolchain (for Papillon frontend) ──────────────────────
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "smoke-wasm"
          cache-on-failure: true
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Cache trunk binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/trunk
          key: trunk-${{ runner.os }}-${{ hashFiles('apps/papillon/frontend/Cargo.lock') }}
          restore-keys: trunk-${{ runner.os }}-
      - name: Install trunk
        run: cargo binstall trunk --no-confirm

      # ── Node.js + Playwright ──────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json', 'e2e/package.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright + wait-on
        working-directory: e2e
        run: |
          npm install
          npx playwright install chromium --with-deps

      # ── Papillon frontend (needed for UI integration tests in the spec) ────
      - name: Build frontend (release WASM)
        run: cd apps/papillon/frontend && trunk build --release

      # ── Chrysalis CI image (lean SSR-only build, no WASM bundle) ──────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Chrysalis CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: e2e/Dockerfile.ci-chrysalis
          push: false
          load: true
          tags: chrysalis-ci:latest
          cache-from: type=gha,scope=chrysalis-ci
          cache-to: type=gha,scope=chrysalis-ci,mode=max

      # ── Start Chrysalis + wait for health ─────────────────────────────────
      - name: Start Chrysalis container
        run: |
          docker run -d \
            --name chrysalis-ci \
            -p 8080:8080 \
            chrysalis-ci:latest
      - name: Wait for Chrysalis to be healthy
        working-directory: e2e
        run: npx wait-on http://localhost:8080/federation/identity --timeout 60000

      # ── Run Chrysalis integration tests ───────────────────────────────────
      - name: Run Chrysalis integration tests
        working-directory: e2e
        env:
          CHRYSALIS_URL: http://localhost:8080
        run: npx playwright test tests/chrysalis-integration.spec.ts --workers=1

      - name: Run Tier 3 canary tests
        working-directory: e2e
        env:
          CHRYSALIS_URL: http://localhost:8080
        run: npx playwright test tests/canary.spec.ts --workers=1 --reporter=line

      # ── Diagnostics + artifacts ───────────────────────────────────────────
      - name: Dump Chrysalis container logs
        if: always()
        run: docker logs chrysalis-ci || true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrysalis-e2e-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
