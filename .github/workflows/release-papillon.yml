name: Release Papillon

on:
  push:
    branches: [main]
    paths:
      - "apps/papillon/**"
      - "crates/pap-core/**"
      - "crates/pap-did/**"
      - "crates/pap-credential/**"
      - "crates/pap-marketplace/**"
      - "crates/pap-proto/**"
      - "crates/pap-webauthn/**"
      - "crates/pap-transport/**"
      - "crates/papillon-shared/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  PRODUCT_NAME: Papillon
  DOCKER_IMAGE: ghcr.io/baur-software/papillon

jobs:
  # ── 1. Detect new version and create tag ─────────────────────────────────────
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read workspace version and check for existing tag
        id: check
        run: |
          VERSION=$(sed -n '/\[workspace\.package\]/,/^$/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          TAG="papillon-v${VERSION}"
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists — skipping release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version ${VERSION} detected — will tag and release"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check.outputs.should_release == 'true'
        run: |
          git tag "papillon-v${{ steps.check.outputs.version }}"
          git push origin "papillon-v${{ steps.check.outputs.version }}"

  # ── 2. Create a draft GitHub Release ─────────────────────────────────────────
  create-release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          NOTES=$(awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          echo "${NOTES}" > /tmp/release-notes.md

      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const notes = fs.readFileSync('/tmp/release-notes.md', 'utf8').trim();
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `papillon-v${process.env.VERSION}`,
              name: `Papillon v${process.env.VERSION}`,
              body: notes || `See [CHANGELOG](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CHANGELOG.md) for details.`,
              draft: true,
              prerelease: false
            });
            return data.id;

  # ── 3. Build Tauri desktop app (macOS / Linux / Windows) ─────────────────────
  # macOS: signed + notarized (Developer ID) when APPLE_* secrets are set.
  # Windows: MSIX bundle produced in addition to NSIS/MSI for Store submission.
  build-desktop:
    needs: [check-version, create-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            tauri_args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin,wasm32-unknown-unknown
          - platform: ubuntu-22.04
            tauri_args: ""
            rust_targets: wasm32-unknown-unknown
          - platform: windows-latest
            # MSIX enables Microsoft Store submission; NSIS/MSI for direct install.
            tauri_args: "--bundles nsis,msi,msix"
            rust_targets: wasm32-unknown-unknown

    runs-on: ${{ matrix.platform }}
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_WINDOWS_SIGNING: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install trunk
        run: cargo binstall trunk --no-confirm --force

      - name: Build frontend (WASM)
        working-directory: apps/papillon/frontend
        run: trunk build --release

      - name: Setup model directory
        shell: bash
        run: mkdir -p apps/papillon/models

      - name: Download bundled TinyLlama model from GitHub Release
        shell: bash
        run: |
          gh release download models-v1 \
            --pattern "tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf" \
            --dir apps/papillon/models \
            --repo ${{ github.repository }} 2>/dev/null || {
            echo "Model release not found — proceeding without bundled model."
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-tauri
        run: cargo install tauri-cli --locked

      - name: Build and upload Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── macOS code signing + Gatekeeper notarization ──────────────────
          # Set these secrets to enable signed/notarized macOS builds.
          # Required secrets: APPLE_CERTIFICATE (base64 .p12),
          #   APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          #   APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # ── Windows code signing ──────────────────────────────────────────
          # Required secrets: WINDOWS_CERTIFICATE (base64 .pfx),
          #   WINDOWS_CERTIFICATE_PASSWORD
          TAURI_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          TAURI_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: apps/papillon
          tauriScript: cargo tauri
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.tauri_args }}

      # ── Submit MSIX to Microsoft Partner Center ─────────────────────────
      # Required secrets: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
      #   MICROSOFT_STORE_APP_ID (from Partner Center > App identity)
      - name: Submit MSIX to Microsoft Store
        if: |
          matrix.platform == 'windows-latest' &&
          env.HAS_WINDOWS_SIGNING == 'true' &&
          secrets.MICROSOFT_STORE_APP_ID != ''
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          STORE_APP_ID: ${{ secrets.MICROSOFT_STORE_APP_ID }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          $msix = Get-ChildItem -Recurse -Path "apps\papillon\target" `
            -Filter "*.msix" | Select-Object -First 1
          if (-not $msix) {
            Write-Warning "No MSIX found — skipping Store submission"
            exit 0
          }
          Write-Host "Submitting $($msix.Name) to Microsoft Store…"

          # Obtain Azure AD token for the Store API
          $tokenBody = @{
            grant_type    = "client_credentials"
            client_id     = $env:AZURE_CLIENT_ID
            client_secret = $env:AZURE_CLIENT_SECRET
            resource      = "https://manage.devcenter.microsoft.com"
          }
          $token = (Invoke-RestMethod `
            -Uri "https://login.microsoftonline.com/$env:AZURE_TENANT_ID/oauth2/token" `
            -Method Post -Body $tokenBody).access_token
          $hdrs = @{
            Authorization  = "Bearer $token"
            "Content-Type" = "application/json"
          }

          $base = "https://manage.devcenter.microsoft.com/v1.0/my/applications/$env:STORE_APP_ID"

          # Create a new submission
          $sub = Invoke-RestMethod -Uri "$base/submissions" -Method Post -Headers $hdrs
          $subId = $sub.id
          Write-Host "Created submission $subId"

          # Upload the MSIX package
          $uploadUrl = $sub.fileUploadUrl
          $bytes = [System.IO.File]::ReadAllBytes($msix.FullName)
          Invoke-RestMethod -Uri $uploadUrl -Method Put -Body $bytes `
            -ContentType "application/zip" -Headers $hdrs

          # Update the submission with the new package
          $subBody = $sub | ConvertTo-Json -Depth 10
          Invoke-RestMethod -Uri "$base/submissions/$subId" -Method Put `
            -Headers $hdrs -Body $subBody

          # Commit the submission to trigger review
          Invoke-RestMethod -Uri "$base/submissions/$subId/commit" `
            -Method Post -Headers $hdrs
          Write-Host "Submission $subId committed for review."

  # ── 4. Build mobile — iOS (thin client) ──────────────────────────────────────
  # Mobile builds are lightweight Capacitor wrappers around the WASM frontend.
  # The app connects to a Papillon desktop instance (LAN) or Chrysalis server
  # (internet) — no local LLM inference or Rust backend on the device.
  # App Store submission: set APPLE_API_KEY_ID, APPLE_API_ISSUER,
  #   APPLE_API_PRIVATE_KEY (base64 .p8) in repo secrets.
  build-mobile-ios:
    needs: [check-version, create-release, build-web]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_ASC_API_KEY: ${{ secrets.APPLE_API_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: papillon-web-dist
          path: apps/papillon/frontend/dist/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Initialize Capacitor iOS project
        working-directory: apps/papillon
        run: |
          npm init -y
          npm install @capacitor/core@^8 @capacitor/cli@^8 @capacitor/ios@^8

          npx cap init "Papillon" "com.baursoftware.papillon" \
            --web-dir frontend/dist

          npx cap add ios
          npx cap sync ios

      - name: Install Apple certificate and provisioning profile
        if: env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          PP_PATH=$RUNNER_TEMP/provision.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERT_PATH"
          echo -n "$APPLE_PROVISIONING_PROFILE" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build iOS archive
        working-directory: apps/papillon/ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Papillon.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export IPA (when signing is available)
        if: env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          cat > $RUNNER_TEMP/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Papillon.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/export.plist \
            -exportPath $RUNNER_TEMP/ipa/

      - name: Upload iOS artifacts to release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          VERSION: ${{ needs.check-version.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const globber = await glob.create(`${process.env.RUNNER_TEMP}/**/*.ipa`);
            for await (const file of globber.globGenerator()) {
              const data = fs.readFileSync(file);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: parseInt(process.env.RELEASE_ID),
                name: `Papillon-${process.env.VERSION}-ios.ipa`,
                data
              });
            }

      # ── Submit IPA to App Store Connect (TestFlight → App Store) ──────────
      # Requires: APPLE_API_KEY_ID, APPLE_API_ISSUER,
      #           APPLE_API_PRIVATE_KEY (base64-encoded .p8 file)
      - name: Write App Store Connect API key
        if: env.HAS_APPLE_SIGNING == 'true' && env.HAS_ASC_API_KEY == 'true'
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APPLE_API_PRIVATE_KEY" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Submit IPA to App Store Connect
        if: env.HAS_APPLE_SIGNING == 'true' && env.HAS_ASC_API_KEY == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          IPA=$(find "$RUNNER_TEMP/ipa" -name "*.ipa" 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then
            echo "No IPA found — skipping App Store submission"
            exit 0
          fi
          echo "Submitting $IPA to App Store Connect…"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER"

  # ── 5. Build mobile — Android (thin client) ─────────────────────────────────
  # Produces a signed AAB (Android App Bundle) for Google Play, plus a
  # sideloadable APK when no production keystore is present.
  # Google Play submission: set GOOGLE_PLAY_JSON_KEY in repo secrets.
  build-mobile-android:
    needs: [check-version, create-release, build-web]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE != '' }}
      HAS_PLAY_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: papillon-web-dist
          path: apps/papillon/frontend/dist/

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Initialize Capacitor Android project
        working-directory: apps/papillon
        run: |
          npm init -y
          npm install @capacitor/core@^8 @capacitor/cli@^8 @capacitor/android@^8

          npx cap init "Papillon" "com.baursoftware.papillon" \
            --web-dir frontend/dist

          npx cap add android
          npx cap sync android

      # Build AAB for Google Play + APK for sideloading / GitHub Release
      - name: Build Android AAB (Google Play) and APK (sideload)
        working-directory: apps/papillon/android
        run: ./gradlew bundleRelease assembleRelease

      - name: Sign AAB and APK (production keystore)
        if: env.HAS_ANDROID_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo -n "$ANDROID_KEYSTORE" | base64 --decode > $RUNNER_TEMP/keystore.jks
          BUILD_TOOLS=$(ls -1 "$ANDROID_HOME/build-tools/" | sort -V | tail -1)

          # Sign APK
          APK=$(find apps/papillon/android -name "*-release-unsigned.apk" -type f | head -1)
          if [ -n "$APK" ]; then
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign \
              --ks $RUNNER_TEMP/keystore.jks \
              --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
              --ks-key-alias "${ANDROID_KEY_ALIAS}" \
              --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
              --out "${APK%-unsigned.apk}.apk" \
              "$APK"
          fi

          # Sign AAB with jarsigner (apksigner does not support AAB)
          AAB=$(find apps/papillon/android -name "*-release.aab" -type f | head -1)
          if [ -n "$AAB" ]; then
            jarsigner -verbose \
              -keystore $RUNNER_TEMP/keystore.jks \
              -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
              -keypass "${ANDROID_KEY_PASSWORD}" \
              -signedjar "${AAB%.aab}-signed.aab" \
              "$AAB" \
              "${ANDROID_KEY_ALIAS}"
          fi

      - name: Sign APK (self-signed for sideloading, no Play signing)
        if: env.HAS_ANDROID_SIGNING != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore $RUNNER_TEMP/debug.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias debug -storepass android -keypass android \
            -dname "CN=Papillon Debug, O=Baur Software"
          BUILD_TOOLS=$(ls -1 "$ANDROID_HOME/build-tools/" | sort -V | tail -1)
          APK=$(find apps/papillon/android -name "*-release-unsigned.apk" -type f | head -1)
          if [ -n "$APK" ]; then
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign \
              --ks $RUNNER_TEMP/debug.jks \
              --ks-pass pass:android \
              --ks-key-alias debug \
              --key-pass pass:android \
              --out "${APK%-unsigned.apk}.apk" \
              "$APK"
          fi

      - name: Upload Android APK to GitHub Release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          VERSION: ${{ needs.check-version.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const globber = await glob.create('apps/papillon/android/**/*-release*.apk');
            for await (const file of globber.globGenerator()) {
              if (file.includes('unsigned')) continue;
              const data = fs.readFileSync(file);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: parseInt(process.env.RELEASE_ID),
                name: `Papillon-${process.env.VERSION}-android.apk`,
                data
              });
            }

      # ── Submit AAB to Google Play ────────────────────────────────────────
      # Requires: GOOGLE_PLAY_JSON_KEY (service account JSON, base64-encoded)
      #           ANDROID_KEYSTORE + signing secrets (production keystore required)
      # The package name must be registered in Google Play Console first.
      - name: Write Google Play service account key
        if: env.HAS_ANDROID_SIGNING == 'true' && env.HAS_PLAY_KEY == 'true'
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: echo -n "$GOOGLE_PLAY_JSON_KEY" | base64 --decode > $RUNNER_TEMP/play-key.json

      - name: Submit AAB to Google Play (internal track)
        if: env.HAS_ANDROID_SIGNING == 'true' && env.HAS_PLAY_KEY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ runner.temp }}/play-key.json
          packageName: com.baursoftware.papillon
          releaseFiles: apps/papillon/android/**/*-signed.aab
          track: internal
          status: completed
          inAppUpdatePriority: 2

  # ── 6. Build web (WASM) ─────────────────────────────────────────────────────
  build-web:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install trunk
        run: cargo binstall trunk --no-confirm --force

      - name: Build frontend (WASM)
        working-directory: apps/papillon/frontend
        run: trunk build --release

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: papillon-web-dist
          path: apps/papillon/frontend/dist/
          retention-days: 5

  # ── 7. Publish npm package (@baur-software/papillon) ────────────────────────
  publish-npm:
    needs: [check-version, build-web]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: papillon-web-dist
          path: packages/papillon-cli/dist/

      - name: Set package version
        working-directory: packages/papillon-cli
        run: npm version "${{ needs.check-version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        working-directory: packages/papillon-cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── 8. Publish Docker image (ghcr.io/baur-software/papillon) ───────────────
  publish-docker:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/papillon/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ needs.check-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 9. Publish the release (un-draft) ────────────────────────────────────────
  publish-release:
    needs: [create-release, build-desktop, build-mobile-ios, build-mobile-android, publish-npm, publish-docker]
    if: |
      always() &&
      needs.create-release.result == 'success' &&
      needs.build-desktop.result == 'success' &&
      (needs.build-mobile-ios.result == 'success' || needs.build-mobile-ios.result == 'skipped') &&
      (needs.build-mobile-android.result == 'success' || needs.build-mobile-android.result == 'skipped') &&
      (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped') &&
      (needs.publish-docker.result == 'success' || needs.publish-docker.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: parseInt(process.env.RELEASE_ID),
              draft: false
            });

  # ── 10. Post-deploy canary ───────────────────────────────────────────────────
  canary-verify:
    name: Post-Deploy Canary Verification
    needs: [publish-release, build-web]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: papillon-web-dist
          path: apps/papillon/frontend/dist/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: e2e
        run: |
          npm install -D @playwright/test
          npx playwright install --with-deps chromium

      - name: Run canary health checks
        working-directory: e2e
        run: npx playwright test tests/canary.spec.ts --reporter=html
        timeout-minutes: 15

      - name: Upload canary report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: papillon-canary-report
          path: playwright-report/
          retention-days: 7
