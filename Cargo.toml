[workspace]
resolver = "2"
exclude = ["apps/papillon/frontend", "apps/registry/frontend", "fuzz"]
members = [
    "crates/pap-did",
    "crates/pap-core",
    "crates/pap-ecash",
    "crates/pap-credential",
    "crates/pap-marketplace",
    "crates/pap-webauthn",
    "crates/pap-proto",
    "crates/pap-transport",
    "crates/pap-bluefield",
    "crates/pap-federation",
    "crates/pap-agents",
    "crates/pap-tee",
    "crates/pap-python",
    "crates/pap-c",
    "crates/pap-wasm",
    "crates/pap-credential-store",
    "crates/pap-test-utils",
    "crates/papillon-shared",
    "crates/pap-sandbox",
    "apps/papillon",
    "apps/registry",
    "benches",
    "examples/search",
    "examples/travel-booking",
    "examples/delegation-chain",
    "examples/payment",
    "examples/networked-search",
    "examples/webauthn-ceremony",
    "examples/federated-discovery",
    "examples/credential-lifecycle",
    "examples/protocol-envelope",
    "examples/tee-attestation",
    "examples/selective-disclosure-decay",
    "examples/intent-routing",
    "examples/bluefield-loopback",
    "examples/seed-ontology",
]

[workspace.package]
version = "0.8.3"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Baur-Software/pap"

[workspace.lints.clippy]
unwrap_used = "warn"

[workspace.dependencies]
pap-did = { path = "crates/pap-did" }
pap-core = { path = "crates/pap-core" }
pap-credential = { path = "crates/pap-credential" }
pap-marketplace = { path = "crates/pap-marketplace" }
pap-webauthn = { path = "crates/pap-webauthn" }
pap-proto = { path = "crates/pap-proto" }
pap-transport = { path = "crates/pap-transport" }
pap-bluefield = { path = "crates/pap-bluefield", default-features = false }
pap-federation = { path = "crates/pap-federation", default-features = false }
pap-agents = { path = "crates/pap-agents" }
pap-tee = { path = "crates/pap-tee" }
pap-credential-store = { path = "crates/pap-credential-store" }
pap-ecash = { path = "crates/pap-ecash" }
pap-test-utils = { path = "crates/pap-test-utils" }
papillon-shared = { path = "crates/papillon-shared" }
pap-sandbox = { path = "crates/pap-sandbox" }

blind-rsa-signatures = "0.14"
rsa = { version = "0.9", features = ["pem"] }
rand_chacha = { version = "0.3" }

ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
base64 = "0.22"
bs58 = "0.5"
multibase = "0.9"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
reqwest = { version = "=0.12.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rcgen = { version = "0.13", features = ["ring"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
tokio-rustls = "0.26"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
hex = "0.4"
candle-core = "0.10"
candle-transformers = "0.10"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
ordvec = "0.3"
csv = "1"
getrandom = { version = "0.2", default-features = false }
zeroize = { version = "1", features = ["derive"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
curve25519-dalek = { version = "4", features = ["digest"] }
criterion = { version = "0.5", features = ["html_reports"] }
hpke = "0.11"
semver = "1"

# Local patch to work around Windows registry permission issue on this machine.
# The icu_locale_core crate in the cargo cache has unreadable src/ files;
# this redirects to an extracted copy. Remove once registry is repaired.
[[workspace.metadata.leptos]]
name          = "pap-registry"
bin-package   = "pap-registry"
bin-target    = "pap-registry"
lib-package   = "pap-registry"
bin-features  = ["ssr"]
lib-features  = ["hydrate"]
style-file    = "apps/registry/styles/main.css"
site-pkg-dir  = "pkg"
site-root     = "target/site"
site-addr     = "127.0.0.1:7890"
reload-port   = 3001
output-name   = "pap-registry-ui"

[patch.crates-io]
icu_locale_core = { path = "vendor-icu" }
